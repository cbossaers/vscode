
name: Build Privacy-Hardened Code - OSS

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the release was already built
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: upstream-code-oss-release-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/vscode/releases?per_page=100" \
            | jq -er \
              '[.[] | select(.draft == false and .prerelease == false)]
               | .[0].tag_name // empty')

          test -n "$TAG" || {
            echo "No stable release found"
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          OLD=""
          if [ -f .upstream-vscode-release ]; then
            OLD=$(cat .upstream-vscode-release)
          fi

          if [ "$TAG" != "$OLD" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            task: vscode-linux-x64-min
            output: VSCode-linux-x64
            archive: code-oss-linux-x64.tar.gz
          - os: windows-2022
            platform: windows-x64
            task: vscode-win32-x64-min
            output: VSCode-win32-x64
            archive: code-oss-windows-x64.zip

    steps:
      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ needs.check.outputs.tag }}
          path: vscode
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ libx11-dev \
            libxkbfile-dev libsecret-1-dev \
            libkrb5-dev python-is-python3 pkg-config

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Locate Windows SDK SignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $tool = if (Test-Path $kits) {
            Get-ChildItem $kits -Filter signtool.exe -Recurse -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if (-not $tool) {
            throw "SignTool is not installed on this runner."
          }

          $tool.DirectoryName |
            Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Disable Copilot shim in build task
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "build/gulpfile.vscode.ts"
          $source = Get-Content $file -Raw

          # Replace the helper implementation, not the call site.
          # This skips the Copilot SDK-dependent packaging operation.
          $pattern = '(?s)function prepareCopilotRipgrepShimTask\s*\([^)]*\)\s*\{.*?^\}'
          if (-not [regex]::IsMatch($source, $pattern, [System.Text.RegularExpressions.RegexOptions]::Multiline)) {
            throw "Could not find prepareCopilotRipgrepShimTask. Upstream source changed."
          }

          $replacement = @'
          function prepareCopilotRipgrepShimTask(_platform: string, _arch: string, _destinationFolderName: string) {
            return () => {
              console.log('Skipping Copilot ripgrep shim for privacy-focused build.');
            };
          }
          '@

          $source = [regex]::Replace(
            $source,
            $pattern,
            $replacement,
            [System.Text.RegularExpressions.RegexOptions]::Multiline
          )

          Set-Content $file -Value $source -Encoding utf8

      - name: Install npm dependencies
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm install

      - name: Disable legacy telemetry default
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "product.json"

          if (-not (Test-Path $file)) {
            throw "Source product.json not found."
          }

          $product = Get-Content $file -Raw | ConvertFrom-Json
          $product | Add-Member -NotePropertyName enableTelemetry `
            -NotePropertyValue $false -Force

          $product | ConvertTo-Json -Depth 100 |
            Set-Content $file -Encoding utf8

      - name: Build application
        working-directory: vscode
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gulp ${{ matrix.task }}

      - name: Remove built-in Copilot extension
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = "Stop"
          $extensions = "vscode/$env:OUTPUT_DIR/resources/app/extensions"
          $copilot = Join-Path $extensions "copilot"

          if (Test-Path $copilot) {
            Remove-Item $copilot -Recurse -Force
          }

          if (Test-Path $copilot) {
            throw "Copilot extension still exists in package."
          }

          Write-Host "Copilot extension excluded."

      
      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.archive }}" \
            -C vscode "${{ matrix.output }}"

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "vscode/${{ matrix.output }}" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-oss-${{ matrix.platform }}-${{ needs.check.outputs.tag }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  record:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record successfully built release
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          echo "$UPSTREAM_TAG" > .upstream-vscode-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-vscode-release
          if ! git diff --cached --quiet; then
            git commit -m "chore: record upstream VS Code release"
            git push
          fi
