name: Build VS Code (Windows + Linux)

# Place this file at .github/workflows/build-vscode.yml in YOUR repo.
# It checks microsoft/vscode for new stable tags, mirrors each selected release
# tag and its complete source history into YOUR fork, then builds from that fork.
# Custom product.json settings, Open VSX, and packaging fixes are applied at build time.

on:
  schedule:
    - cron: "0 */6 * * *" # poll for new upstream tags every 6 hours
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Tag to build from your fork (blank = latest upstream stable tag; if upstream is unavailable, latest mirrored tag)"
        required: false
        type: string
      force:
        description: "Rebuild even if a release for this tag already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-vscode-${{ inputs.upstream_tag || 'latest' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: microsoft/vscode

jobs:
  # ---------------------------------------------------------------------------
  # 1. Select a stable tag, compare it with the fork, and decide whether to build
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve source tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      should_sync: ${{ steps.resolve.outputs.should_sync }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve tag in upstream and fork; decide sync/build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          FORK_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          # Validate user-provided tags before inserting them into git refspecs.
          validate_tag() {
            [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Invalid tag '$1'. Expected a stable X.Y.Z tag such as 1.143.0."
              exit 1
            }
          }

          # Resolve lightweight and annotated tags to the commit they reference.
          # Return an empty string when the tag does not exist or cannot be queried.
          resolve_tag() {
            local url="$1" tag="$2" authenticated="$3" refs
            if [[ "$authenticated" == "true" ]]; then
              refs="$(git -c http.extraheader="$AUTH_HEADER" ls-remote --tags "$url" \
                "refs/tags/${tag}" "refs/tags/${tag}^{}" 2>/dev/null)" || return 1
            else
              refs="$(git ls-remote --tags "$url" \
                "refs/tags/${tag}" "refs/tags/${tag}^{}" 2>/dev/null)" || return 1
            fi
            printf '%s\n' "$refs" | awk -v direct="refs/tags/${tag}" -v peeled="refs/tags/${tag}^{}" '
              $2 == peeled { peeled_sha = $1 }
              $2 == direct { direct_sha = $1 }
              END {
                if (peeled_sha != "") print peeled_sha
                else if (direct_sha != "") print direct_sha
              }
            '
          }

          # The fork must be reachable with this workflow's token. Keep its tag
          # list for offline fallback if microsoft/vscode cannot be queried.
          if ! FORK_TAG_REFS="$(git -c http.extraheader="$AUTH_HEADER" \
              ls-remote --tags --refs "$FORK_URL" 2>/dev/null)"; then
            echo "::error::Could not read tags from $GITHUB_REPOSITORY using GITHUB_TOKEN."
            exit 1
          fi
          FORK_TAGS="$(printf '%s\n' "$FORK_TAG_REFS" \
            | awk '{print $2}' | sed 's#^refs/tags/##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"

          NEEDS_SYNC=false
          UPSTREAM_AVAILABLE=false
          TAG=""
          COMMIT=""

          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
            validate_tag "$TAG"

            # Prefer the fork's source tag so manual builds continue to work even
            # if upstream is unavailable. Only fetch upstream when the fork lacks it.
            FORK_COMMIT="$(resolve_tag "$FORK_URL" "$TAG" true || true)"
            if [[ -n "$FORK_COMMIT" ]]; then
              COMMIT="$FORK_COMMIT"
              echo "Using existing source tag ${TAG} from ${GITHUB_REPOSITORY}."
            else
              UPSTREAM_COMMIT="$(resolve_tag "$UPSTREAM_URL" "$TAG" false || true)"
              if [[ -z "$UPSTREAM_COMMIT" ]]; then
                echo "::error::Tag ${TAG} is not present in the fork and could not be resolved in ${UPSTREAM_REPO}."
                exit 1
              fi
              COMMIT="$UPSTREAM_COMMIT"
              NEEDS_SYNC=true
              UPSTREAM_AVAILABLE=true
            fi
          else
            # Scheduled runs use the newest stable upstream tag when available.
            # If upstream is inaccessible, fall back to the newest stable tag that
            # has already been mirrored into the fork (useful for recovery builds).
            if UPSTREAM_TAG_REFS="$(git ls-remote --tags --refs "$UPSTREAM_URL" 2>/dev/null)"; then
              UPSTREAM_TAGS="$(printf '%s\n' "$UPSTREAM_TAG_REFS" \
                | awk '{print $2}' | sed 's#^refs/tags/##' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
              if [[ -n "$UPSTREAM_TAGS" ]]; then
                UPSTREAM_AVAILABLE=true
                TAG="$(printf '%s\n' "$UPSTREAM_TAGS" | tail -n1)"
                UPSTREAM_COMMIT="$(resolve_tag "$UPSTREAM_URL" "$TAG" false || true)"
                if [[ -n "$UPSTREAM_COMMIT" ]]; then
                  FORK_COMMIT="$(resolve_tag "$FORK_URL" "$TAG" true || true)"
                  if [[ -n "$FORK_COMMIT" ]]; then
                    if [[ "$FORK_COMMIT" != "$UPSTREAM_COMMIT" ]]; then
                      echo "::error::Tag ${TAG} exists in both upstream and fork but points to different commits. Refusing to overwrite an existing source tag."
                      echo "Fork: ${FORK_COMMIT}; upstream: ${UPSTREAM_COMMIT}"
                      exit 1
                    fi
                    COMMIT="$FORK_COMMIT"
                  else
                    COMMIT="$UPSTREAM_COMMIT"
                    NEEDS_SYNC=true
                  fi
                fi
              fi
            fi

            # If upstream is down/unavailable (or its tag listing could not be
            # resolved), select the newest stable tag already stored in the fork.
            if [[ -z "$TAG" || -z "$COMMIT" ]]; then
              if [[ -z "$FORK_TAGS" ]]; then
                echo "::error::Could not resolve an upstream stable tag and the fork contains no stable X.Y.Z tags for fallback."
                exit 1
              fi
              TAG="$(printf '%s\n' "$FORK_TAGS" | tail -n1)"
              COMMIT="$(resolve_tag "$FORK_URL" "$TAG" true || true)"
              [[ -n "$COMMIT" ]] || {
                echo "::error::Could not resolve fallback tag ${TAG} in ${GITHUB_REPOSITORY}."
                exit 1
              }
              NEEDS_SYNC=false
              echo "::warning::Upstream latest-tag lookup was unavailable; falling back to mirrored fork tag ${TAG}."
            fi
          fi

          validate_tag "$TAG"
          [[ -n "$COMMIT" ]] || { echo "::error::Could not resolve commit for tag ${TAG}."; exit 1; }

          SHOULD_BUILD=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${FORCE:-false}" != "true" ]]; then
              echo "Release ${TAG} already exists - build will be skipped (the tag will still be mirrored if needed)."
              SHOULD_BUILD=false
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "should_sync=${NEEDS_SYNC}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Selected tag: ${TAG} (${COMMIT}); sync=${NEEDS_SYNC}; build=${SHOULD_BUILD}; upstream_available=${UPSTREAM_AVAILABLE}"

  # ---------------------------------------------------------------------------
  # 2. Mirror the full source history reachable from a new upstream release tag
  #    into the fork. Do NOT replace the fork's default branch: it contains this
  #    workflow. The mirrored tag provides a durable source snapshot for builds.
  # ---------------------------------------------------------------------------
  sync:
    name: Mirror source tag into fork
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: No sync needed
        if: needs.prepare.outputs.should_sync != 'true'
        run: echo "Source tag $TAG is already present in the fork; no upstream sync needed."

      - name: Fetch complete upstream tag history and push tag to fork
        if: needs.prepare.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          FORK_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          # Initialize a fresh, non-shallow repository. Fetching the tag without
          # --depth mirrors its complete commit ancestry, not just a checkout tree.
          git init -q "$WORK_DIR"
          git -C "$WORK_DIR" remote add upstream "$UPSTREAM_URL"
          git -C "$WORK_DIR" fetch --no-tags upstream \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          ACTUAL_COMMIT="$(git -C "$WORK_DIR" rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Upstream tag ${TAG} moved while the workflow was running. Expected ${EXPECTED_COMMIT}, fetched ${ACTUAL_COMMIT}."
            exit 1
          fi

          # Be safe under concurrent/manual runs: never overwrite an existing
          # tag if it points somewhere else.
          EXISTING_REFS="$(git -c http.extraheader="$AUTH_HEADER" \
            ls-remote --tags "$FORK_URL" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" 2>/dev/null || true)"
          EXISTING_COMMIT="$(printf '%s\n' "$EXISTING_REFS" | awk \
            -v direct="refs/tags/${TAG}" -v peeled="refs/tags/${TAG}^{}" '
              $2 == peeled { peeled_sha = $1 }
              $2 == direct { direct_sha = $1 }
              END {
                if (peeled_sha != "") print peeled_sha
                else if (direct_sha != "") print direct_sha
              }
            ')"
          if [[ -n "$EXISTING_COMMIT" ]]; then
            if [[ "$EXISTING_COMMIT" == "$EXPECTED_COMMIT" ]]; then
              echo "Tag ${TAG} was mirrored by another run; no push needed."
              exit 0
            fi
            echo "::error::Fork tag ${TAG} already exists at ${EXISTING_COMMIT}, not expected ${EXPECTED_COMMIT}. Refusing to overwrite it."
            exit 1
          fi

          git -c http.extraheader="$AUTH_HEADER" push "$FORK_URL" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "Mirrored ${TAG} (${ACTUAL_COMMIT}) and its full source history into ${GITHUB_REPOSITORY}."

  # ---------------------------------------------------------------------------
  # 3. Build + package on Linux and Windows, using the fork's mirrored source tag
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, sync]
    if: needs.prepare.outputs.should_build == 'true' && needs.sync.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            rust_target: x86_64-unknown-linux-gnu
          - name: win32-x64
            os: windows-2022
            platform: win32
            rust_target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      UPSTREAM_COMMIT: ${{ needs.prepare.outputs.commit }}
      VSCODE_ARCH: x64
      OUT_DIR: VSCode-${{ matrix.platform }}-x64
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout mirrored VS Code source from this fork @ ${{ needs.prepare.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.tag }}
          path: vscode
          fetch-depth: 1

      - name: Setup Node.js (version from upstream .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc

      - name: Setup Python (needed by node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python setuptools
        run: python -m pip install --upgrade pip setuptools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ---- Linux prerequisites (from upstream CONTRIBUTING/build pipeline) ----
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ pkg-config python-is-python3 jq \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm dpkg-dev xz-utils libssl-dev curl

      # ---- Windows prerequisites --------------------------------------------
      - name: Install MSVC Spectre-mitigated libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $installPath = & "$installerDir\vswhere.exe" -latest -products * -property installationPath
          $vsArgs = @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL.Spectre",
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre",
            "--quiet", "--norestart", "--nocache"
          )
          $p = Start-Process -FilePath "$installerDir\setup.exe" -ArgumentList $vsArgs -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Visual Studio installer failed with exit code $($p.ExitCode)"
          }

      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The job uses Bash on Windows. GitHub prepends Git's usr/bin to PATH for
      # every Bash step, where its GNU link.exe can shadow Microsoft's linker.
      # Pin Cargo to the actual MSVC linker instead of relying on PATH lookup.
      - name: Pin Rust to the Microsoft linker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcToolsDir = $env:VCToolsInstallDir
          $linker = if ($vcToolsDir) { Join-Path $vcToolsDir 'bin\Hostx64\x64\link.exe' } else { $null }

          if (-not $linker -or -not (Test-Path $linker)) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) {
              throw "Could not find vswhere.exe or VCToolsInstallDir; cannot locate the MSVC linker."
            }
            $installPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installPath) {
              throw "Could not find a Visual Studio installation with the x64 C++ tools."
            }
            $toolsRoot = Join-Path $installPath 'VC\Tools\MSVC'
            $toolsDir = Get-ChildItem $toolsRoot -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            if (-not $toolsDir) {
              throw "No MSVC toolset directory found under $toolsRoot."
            }
            $linker = Join-Path $toolsDir.FullName 'bin\Hostx64\x64\link.exe'
          }

          if (-not (Test-Path $linker)) {
            throw "MSVC linker not found at '$linker'."
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pinned Rust MSVC linker: $linker"

      # ---- Customise product.json -------------------------------------------
      # Open VSX gallery and user-overridable privacy/update defaults.
      - name: Patch product.json (Open VSX + default settings)
        working-directory: vscode
        run: |
          cp product.json product.json.orig
          jq '
            .extensionsGallery = {
              serviceUrl: "https://open-vsx.org/vscode/gallery",
              itemUrl: "https://open-vsx.org/vscode/item",
              extensionUrlTemplate: "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest",
              resourceUrlTemplate: "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
              controlUrl: "",
              nlsBaseUrl: "",
              publisherUrl: ""
            }
            | .configurationDefaults = ((.configurationDefaults // {}) + {
                "extensions.autoCheckUpdates": false,
                "extensions.autoUpdate": false,
                "update.mode": "none",
                "update.showReleaseNotes": false,
                "telemetry.telemetryLevel": "off",
                "chat.disableAIFeatures": true
              })
          ' product.json.orig > product.json
          rm product.json.orig
          echo "--- patched product.json (relevant keys) ---"
          jq '{extensionsGallery, configurationDefaults}' product.json

      # product.json is metadata; upstream VS Code does not automatically apply
      # an arbitrary top-level `configurationDefaults` object from it. Wire that
      # object into the configuration registry so it becomes the actual default
      # values at runtime (while users can still override them in settings.json).
      - name: Wire product.json defaults into VS Code configuration
        working-directory: vscode
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path("src/vs/workbench/api/common/configurationExtensionPoint.ts")
          source = path.read_text(encoding="utf-8")
          marker = "// BEGIN custom product.json configuration defaults\n"
          if marker in source:
              raise SystemExit("Custom product defaults patch is already present; refusing to patch twice")

          needle = "defaultConfigurationExtPoint.setHandler((extensions, { added, removed }) => {"
          if source.count(needle) != 1:
              raise SystemExit(
                  f"Expected exactly one configuration extension-point anchor in {path}; "
                  f"found {source.count(needle)}. Upstream source may have changed."
              )

          patch = "\n".join([
              "// BEGIN custom product.json configuration defaults",
              "// The product metadata is intentionally used as defaults, not as enforced policy.",
              "const productConfigurationDefaults = (product as typeof product & { configurationDefaults?: Record<string, unknown> }).configurationDefaults;",
              "if (productConfigurationDefaults && typeof productConfigurationDefaults === 'object') {",
              "\tconfigurationRegistry.deltaConfiguration({",
              "\t\taddedDefaults: [{",
              "\t\t\toverrides: productConfigurationDefaults,",
              "\t\t\tsource: { id: 'product', displayName: 'Product defaults' }",
              "\t\t}]",
              "\t});",
              "}",
              "// END custom product.json configuration defaults",
              "",
              ""
          ])
          source = source.replace(needle, patch + needle, 1)
          path.write_text(source, encoding="utf-8")
          print(f"Patched {path} to apply product.json configurationDefaults")
          PYCODE

      # The from-source Copilot extension build is not identical to the prebuilt
      # VSIX used by Microsoft's CI. The packaging task
      # prepareBuiltInCopilotRipgrepShim still requires this runtime at
      # extensions/copilot/node_modules/@github/copilot/sdk. Re-include the
      # package metadata and SDK subtree after the broad ignore rule.
      - name: Preserve Copilot SDK files for packaging
        working-directory: vscode
        run: |
          set -euo pipefail
          printf '\n!@github/copilot/package.json\n!@github/copilot/sdk/**\n' >> build/.moduleignore
          tail -n 12 build/.moduleignore

      # ---- Install dependencies ---------------------------------------------
      # setup-env.sh runs build/*.ts helpers, which import packages from build/node_modules.
      # Upstream installs the build workspace dependencies before sourcing setup-env.sh.
      - name: Install build-script dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2; do
            if npm ci; then
              ok=1
              break
            fi
            echo "::warning::build npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      # Use the same compiler/sysroot/libc++ setup as Microsoft's Linux pipeline.
      # Do not force GCC 13: setup-env.sh configures Chromium's matching Clang and sysroot.
      - name: npm ci (Linux, upstream toolchain)
        if: runner.os == 'Linux'
        working-directory: vscode
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source ./build/azure-pipelines/linux/setup-env.sh
          node build/npm/preinstall.ts

          ok=0
          for attempt in 1 2; do
            if npm ci; then
              ok=1
              break
            fi
            echo "::warning::npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      - name: npm ci (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node build/npm/preinstall.ts
          ok=0
          for attempt in 1 2; do
            if npm ci; then
              ok=1
              break
            fi
            echo "::warning::npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      # ---- Compile + package the app (portable directory) --------------------
      - name: Build VS Code
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run gulp -- core-ci
          npm run gulp -- compile-extensions-build
          # Must run after compile-extensions-build (which wipes .build/extensions).
          npm run gulp -- compile-copilot-extension-build

          # Validate the source-built extension and the SDK directory required
          # by prepareBuiltInCopilotRipgrepShim during product packaging.
          for f in package.json dist/extension.js; do
            test -f ".build/extensions/copilot/$f" || {
              echo "::error::.build/extensions/copilot/$f missing after compile-copilot-extension-build"
              find .build/extensions/copilot -maxdepth 4 -type f | head -200 || true
              exit 1
            }
          done
          sdk_dir=".build/extensions/copilot/node_modules/@github/copilot/sdk"
          if [[ ! -d "$sdk_dir" ]]; then
            echo "::error::$sdk_dir missing after compile-copilot-extension-build; check build/.moduleignore preservation rules"
            find .build/extensions/copilot/node_modules/@github -maxdepth 5 -print 2>/dev/null | head -200 || true
            exit 1
          fi

          npm run gulp -- "vscode-${{ matrix.platform }}-${VSCODE_ARCH}-min-ci"

      - name: Verify the built product.json contains our customisations
        run: |
          set -euo pipefail
          jq -e '
            .extensionsGallery.serviceUrl == "https://open-vsx.org/vscode/gallery"
            and .configurationDefaults["extensions.autoCheckUpdates"] == false
            and .configurationDefaults["extensions.autoUpdate"] == false
            and .configurationDefaults["update.mode"] == "none"
            and .configurationDefaults["update.showReleaseNotes"] == false
            and .configurationDefaults["telemetry.telemetryLevel"] == "off"
            and .configurationDefaults["chat.disableAIFeatures"] == true
          ' "${OUT_DIR}/resources/app/product.json"

      # ---- CLI / Remote Tunnels binary --------------------------------------
      # Match upstream's glibc 2.28 sysroot and use prebuilt static OpenSSL.
      # This prevents the CLI from pulling in host-only dependencies such as
      # libssl3t64 and GLIBC symbols newer than the supported baseline.
      - name: Build CLI / tunnel binary (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode/cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          SYSROOT_ARCH: amd64
          OPENSSL_STATIC: "1"
          VSCODE_CLI_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail

          npm pack @vscode/openssl-prebuilt@0.0.11
          mkdir -p openssl
          tar -xzf vscode-openssl-prebuilt-0.0.11.tgz --strip-components=1 -C openssl
          export OPENSSL_LIB_DIR="$PWD/openssl/out/x64-linux/lib"
          export OPENSSL_INCLUDE_DIR="$PWD/openssl/out/x64-linux/include"

          export VSCODE_SYSROOT_DIR="$GITHUB_WORKSPACE/vscode/.build/sysroots"
          node -e 'import { getVSCodeSysroot } from "../build/linux/debian/install-sysroot.ts"; (async () => { await getVSCodeSysroot(process.env["SYSROOT_ARCH"]); })()'

          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/bin/x86_64-linux-gnu-gcc"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=--sysroot=$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot -C link-arg=-L$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot/usr/lib/x86_64-linux-gnu"
          export CC_x86_64_unknown_linux_gnu="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/bin/x86_64-linux-gnu-gcc --sysroot=$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot"
          export PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot/usr/lib/x86_64-linux-gnu/pkgconfig:$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR_x86_64_unknown_linux_gnu="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot"
          export OBJDUMP="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/bin/objdump"

          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-gnu --bin=code

          # Enforce the same glibc 2.28 compatibility check used upstream.
          glibc_version="2.28"
          while IFS= read -r line; do
            if [[ "$line" == *"GLIBC_"* ]]; then
              version="$(echo "$line" | awk '{print $5}' | tr -d '()')"
              version="${version#*_}"
              if [[ "$(printf '%s\n%s' "$version" "$glibc_version" | sort -V | tail -n1)" == "$version" ]]; then
                glibc_version="$version"
              fi
            fi
          done < <("$OBJDUMP" -T "$PWD/target/x86_64-unknown-linux-gnu/release/code")
          if [[ "$glibc_version" != "2.28" ]]; then
            echo "::error::CLI requires GLIBC $glibc_version; expected no newer than 2.28"
            exit 1
          fi
          echo "Maximum CLI GLIBC version: $glibc_version"

          TUNNEL_NAME="$(jq -r .tunnelApplicationName ../product.json)"
          mkdir -p "$GITHUB_WORKSPACE/${OUT_DIR}/bin"
          install -m 755 "target/x86_64-unknown-linux-gnu/release/code" \
            "$GITHUB_WORKSPACE/${OUT_DIR}/bin/${TUNNEL_NAME}"
          ls -l "$GITHUB_WORKSPACE/${OUT_DIR}/bin"

      - name: Build CLI / tunnel binary (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode/cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          OPENSSL_STATIC: "1"
          VSCODE_CLI_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail

          npm pack @vscode/openssl-prebuilt@0.0.11
          mkdir -p openssl
          tar -xzf vscode-openssl-prebuilt-0.0.11.tgz --strip-components=1 -C openssl
          export OPENSSL_LIB_DIR="$PWD/openssl/out/x64-windows-static/lib"
          export OPENSSL_INCLUDE_DIR="$PWD/openssl/out/x64-windows-static/include"

          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc --bin=code

          TUNNEL_NAME="$(jq -r .tunnelApplicationName ../product.json)"
          mkdir -p "$GITHUB_WORKSPACE/${OUT_DIR}/bin"
          cp "target/x86_64-pc-windows-msvc/release/code.exe" \
            "$GITHUB_WORKSPACE/${OUT_DIR}/bin/${TUNNEL_NAME}.exe"
          ls -l "$GITHUB_WORKSPACE/${OUT_DIR}/bin"

      # ---- Linux packaging: tar.gz (portable), .deb, .rpm -------------------
      - name: Package (Linux) - tar.gz, deb, rpm
        if: runner.os == 'Linux'
        working-directory: vscode
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # Portable archive.
          tar --owner=0 --group=0 -czf "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.tar.gz" \
            -C "$GITHUB_WORKSPACE" "$OUT_DIR"

          # Debian / Ubuntu installer.
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-prepare-deb"
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-build-deb"

          # Fedora / RHEL / openSUSE installer.
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-prepare-rpm"
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-build-rpm"

          pick() {
            local f
            f="$(find "$1" -type f -name "$2" -print -quit)"
            [[ -n "$f" ]] || { echo "::error::No $2 found under $1"; exit 1; }
            echo "$f"
          }
          cp "$(pick .build/linux/deb '*.deb')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.deb"
          cp "$(pick .build/linux/rpm '*.rpm')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.rpm"
          ls -lh "$GITHUB_WORKSPACE/dist"

      # ---- Windows packaging: zip (portable), system + user installers ------
      - name: Package (Windows) - zip, system setup, user setup
        if: runner.os == 'Windows'
        working-directory: vscode
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"

          npm run gulp -- "vscode-win32-${VSCODE_ARCH}-inno-updater"
          npm run gulp -- "vscode-win32-${VSCODE_ARCH}-system-setup"
          npm run gulp -- "vscode-win32-${VSCODE_ARCH}-user-setup"

          pick() {
            local f
            f="$(find "$1" -type f -name "$2" -print -quit)"
            [[ -n "$f" ]] || { echo "::error::No $2 found under $1"; exit 1; }
            echo "$f"
          }
          cp "$(pick .build/win32-x64/system-setup '*.exe')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64-system-setup.exe"
          cp "$(pick .build/win32-x64/user-setup '*.exe')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64-user-setup.exe"

          # Portable zip (create a "data" folder next to "Code - OSS.exe" for portable mode).
          cd "$GITHUB_WORKSPACE/$OUT_DIR"
          7z a -tzip -mx=5 -bd "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64.zip" ./*
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Create the release (only when mirroring and every build job succeeded)
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [prepare, sync, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.sync.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code - OSS ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Unofficial build of [`microsoft/vscode` ${{ needs.prepare.outputs.tag }}](https://github.com/microsoft/vscode/tree/${{ needs.prepare.outputs.tag }}) (upstream commit `${{ needs.prepare.outputs.commit }}`).

            The release source tag and its complete commit ancestry are mirrored into this repository before the build, and the build checks out that local fork tag. This lets an existing mirrored version be rebuilt even if the upstream repository later becomes unavailable.

            **Build-time changes**
            - Extension marketplace: [Open VSX](https://open-vsx.org)
            - Defaults: `extensions.autoCheckUpdates=false`, `extensions.autoUpdate=false`, `update.mode=none`,
              `update.showReleaseNotes=false`, `telemetry.telemetryLevel=off`, `chat.disableAIFeatures=true`
              (users can still change these in their own settings)

            **Downloads**
            | Platform | Installer | Portable |
            |---|---|---|
            | Windows x64 | `*-win32-x64-system-setup.exe`, `*-win32-x64-user-setup.exe` | `*-win32-x64.zip` (add a `data` folder next to `Code - OSS.exe` for portable mode) |
            | Debian / Ubuntu | `*-linux-x64.deb` | `*-linux-x64.tar.gz` |
            | Fedora / RHEL / openSUSE | `*-linux-x64.rpm` | `*-linux-x64.tar.gz` |

            Binaries are unsigned. Verify downloads with `SHA256SUMS.txt`.
