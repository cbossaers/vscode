
name: Build Privacy-Hardened Code - OSS

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the release was already built
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: upstream-code-oss-release-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Check latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/vscode/releases?per_page=100" \
            | jq -er \
              '[.[] | select(.draft == false and .prerelease == false)]
               | .[0].tag_name // empty')

          test -n "$TAG" || {
            echo "No stable release found"
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          OLD=""
          if [ -f .upstream-vscode-release ]; then
            OLD=$(cat .upstream-vscode-release)
          fi

          if [ "$TAG" != "$OLD" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  catalogue:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and validate the BYOK model catalogue
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://main.vscode-cdn.net/extensions/copilotChat.json" \
            --output copilotChat.json

          jq -e '(.version == 1) and (.modelInfo | type == "object")' \
            copilotChat.json >/dev/null

          echo "Downloaded and validated BYOK model catalogue."
          sha256sum copilotChat.json

      - name: Upload validated catalogue
        uses: actions/upload-artifact@v7
        with:
          name: byok-known-model-catalogue-${{ needs.check.outputs.tag }}
          path: copilotChat.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [check, catalogue]
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform installs dependencies once, builds the standard
          # edition, then rebuilds the same checkout after removing core
          # Chat/agent entry points for the no-AI edition. node_modules is reused.
          - os: ubuntu-26.04
            cache_os: linux
            platform: linux-x64
            task: vscode-linux-x64-min
            output: VSCode-linux-x64
            archive_standard: code-oss-linux-x64.tar.gz
            archive_no_ai: code-oss-linux-x64-no-ai.tar.gz

          - os: windows-2022
            cache_os: windows
            platform: windows-x64
            task: vscode-win32-x64-min
            output: VSCode-win32-x64
            archive_standard: code-oss-windows-x64.zip
            archive_no_ai: code-oss-windows-x64-no-ai.zip

    steps:
      - name: Checkout upstream release
        uses: actions/checkout@v7
        with:
          repository: microsoft/vscode
          ref: ${{ needs.check.outputs.tag }}
          path: vscode
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ libx11-dev \
            libxkbfile-dev libsecret-1-dev \
            libkrb5-dev python-is-python3 pkg-config

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Locate Windows SDK SignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $tool = if (Test-Path $kits) {
            Get-ChildItem $kits -Filter signtool.exe -Recurse -File |
              Where-Object {
                $_.FullName -match '\\x64\\signtool\.exe$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if (-not $tool) {
            throw "SignTool is not installed on this runner."
          }

          $tool.DirectoryName |
            Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Disable Copilot shim in build task
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "build/gulpfile.vscode.ts"
          $source = Get-Content $file -Raw

          $pattern = '(?s)function prepareCopilotRipgrepShimTask\s*\([^)]*\)\s*\{.*?^\}'

          if (-not [regex]::IsMatch(
            $source,
            $pattern,
            [System.Text.RegularExpressions.RegexOptions]::Multiline
          )) {
            throw "Could not find prepareCopilotRipgrepShimTask. Upstream source changed."
          }

          $replacement = @'
          function prepareCopilotRipgrepShimTask(_platform: string, _arch: string, _destinationFolderName: string) {
            return () => {
              console.log('Skipping Copilot ripgrep shim for privacy-focused build.');
            };
          }
          '@

          $source = [regex]::Replace(
            $source,
            $pattern,
            $replacement,
            [System.Text.RegularExpressions.RegexOptions]::Multiline
          )

          Set-Content $file -Value $source -Encoding utf8

      # Reuse the dependency cache strategy and archive scripts from the
      # checked-out upstream tag. Its key includes package manifests/lockfiles,
      # npm configuration, cache salt, platform/architecture, and Node version.
      - name: Prepare node_modules cache key (Linux)
        if: runner.os == 'Linux'
        id: node-modules-key-linux
        working-directory: vscode
        shell: bash
        env:
          CACHE_OS: ${{ matrix.cache_os }}
        run: |
          set -euo pipefail
          mkdir -p .build
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts \
            "$CACHE_OS" x64 "$(node -p process.arch)" > .build/packagelockhash
          lock_hash="$(tr -d '\r\n' < .build/packagelockhash)"
          echo "key=node_modules-${CACHE_OS}-${lock_hash}-node-$(node -p process.version)" >> "$GITHUB_OUTPUT"

      - name: Prepare node_modules cache key (Windows)
        if: runner.os == 'Windows'
        id: node-modules-key-windows
        working-directory: vscode
        shell: pwsh
        env:
          CACHE_OS: ${{ matrix.cache_os }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .build | Out-Null
          $architecture = node -p process.arch
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts $env:CACHE_OS x64 $architecture |
            Set-Content -Path .build/packagelockhash -Encoding ascii
          $lockHash = (Get-Content .build/packagelockhash -Raw).Trim()
          $nodeVersion = node -p process.version
          "key=node_modules-$env:CACHE_OS-$lockHash-node-$nodeVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v6
        with:
          path: vscode/.build/node_modules_cache
          key: ${{ steps.node-modules-key-linux.outputs.key || steps.node-modules-key-windows.outputs.key }}

      - name: Extract node_modules cache (Linux)
        if: runner.os == 'Linux' && steps.node-modules-cache.outputs.cache-hit == 'true'
        working-directory: vscode
        shell: bash
        run: ./.github/workflows/node_modules_cache/cache.sh extract

      - name: Extract node_modules cache (Windows)
        if: runner.os == 'Windows' && steps.node-modules-cache.outputs.cache-hit == 'true'
        working-directory: vscode
        shell: pwsh
        run: ./.github/workflows/node_modules_cache/cache.ps1 extract

      - name: Install npm dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm install

      - name: Archive node_modules cache (Linux)
        if: runner.os == 'Linux' && steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        shell: bash
        run: ./.github/workflows/node_modules_cache/cache.sh archive

      - name: Archive node_modules cache (Windows)
        if: runner.os == 'Windows' && steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        shell: pwsh
        run: ./.github/workflows/node_modules_cache/cache.ps1 archive

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vscode/.build/node_modules_cache
          key: ${{ steps.node-modules-key-linux.outputs.key || steps.node-modules-key-windows.outputs.key }}


      - name: Download validated BYOK catalogue
        uses: actions/download-artifact@v7
        with:
          name: byok-known-model-catalogue-${{ needs.check.outputs.tag }}
          path: byok-catalogue

      - name: Embed BYOK catalogue and remove its runtime network request
        working-directory: vscode
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const cataloguePath = path.resolve('../byok-catalogue/copilotChat.json');
          const catalogue = JSON.parse(fs.readFileSync(cataloguePath, 'utf8'));
          if (catalogue.version !== 1 || !catalogue.modelInfo || typeof catalogue.modelInfo !== 'object') {
            throw new Error('The downloaded BYOK catalogue has an unexpected format.');
          }

          const modulePath = path.join(
            'extensions/copilot/src/extension/byok/vscode-node',
            'byokKnownModels.generated.ts'
          );
          const generated = [
            '/* Generated by the Code - OSS build workflow. Do not edit manually. */',
            `export const LOCAL_BYOK_KNOWN_MODELS: unknown = JSON.parse(${JSON.stringify(JSON.stringify(catalogue))});`,
            ''
          ].join('\n');
          fs.writeFileSync(modulePath, generated, 'utf8');

          const sourcePath = 'extensions/copilot/src/extension/byok/vscode-node/byokContribution.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const providerImport = "import { BYOKKnownModels, isClientBYOKAllowed } from '../../byok/common/byokProvider';";
          if (source.split(providerImport).length !== 2) {
            throw new Error('Could not find exactly one BYOK provider import; upstream source changed.');
          }
          source = source.replace(
            providerImport,
            providerImport + "\nimport { LOCAL_BYOK_KNOWN_MODELS } from './byokKnownModels.generated';"
          );

          const methodSignature = 'private async _fetchKnownModelList(fetcherService: IFetcherService): Promise<Record<string, BYOKKnownModels>> {';
          if (source.split(methodSignature).length !== 2) {
            throw new Error('Could not find exactly one BYOK model-list method signature; upstream source changed.');
          }
          source = source.replace(
            methodSignature,
            'private async _fetchKnownModelList(_fetcherService: IFetcherService): Promise<Record<string, BYOKKnownModels>> {'
          );

          const fetchStatement = "const data = await (await fetcherService.fetch('https://main.vscode-cdn.net/extensions/copilotChat.json', { method: 'GET', callSite: 'byok-known-models' })).json();";
          if (source.split(fetchStatement).length !== 2) {
            throw new Error('Could not find exactly one runtime catalogue fetch; upstream source changed.');
          }
          source = source.replace(
            fetchStatement,
            'const data = LOCAL_BYOK_KNOWN_MODELS as { version: number; modelInfo: Record<string, BYOKKnownModels> };'
          );
          source = source.replace(
            "this._logService.info('BYOK: fetching known models list');",
            "this._logService.info('BYOK: loading bundled known models list');"
          );
          source = source.replace(
            "this._logService.info('BYOK: Copilot Chat known models list fetched successfully.');",
            "this._logService.info('BYOK: bundled Copilot Chat known models list loaded successfully.');"
          );

          fs.writeFileSync(sourcePath, source, 'utf8');
          console.log(`Embedded catalogue and patched ${sourcePath}.`);
          NODE

      - name: Disable legacy telemetry default
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "product.json"

          if (-not (Test-Path $file)) {
            throw "Source product.json not found."
          }

          $product = Get-Content $file -Raw | ConvertFrom-Json

          $product | Add-Member `
            -NotePropertyName enableTelemetry `
            -NotePropertyValue $false `
            -Force

          $product |
            ConvertTo-Json -Depth 100 |
            Set-Content $file -Encoding utf8

      - name: Configure Open VSX marketplace and telemetry ceiling
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "product.json"

          if (-not (Test-Path $file)) {
            throw "Source product.json not found."
          }

          $product = Get-Content $file -Raw | ConvertFrom-Json

          # Configure the standard edition here. After its archive is created,
          # a separate source-patched build produces the no-AI edition.
          $product | Add-Member `
            -NotePropertyName builtInExtensionsEnabledWithAutoUpdates `
            -NotePropertyValue @() `
            -Force

          if (-not $product.extensionsGallery) {
            $product | Add-Member `
              -NotePropertyName extensionsGallery `
              -NotePropertyValue ([pscustomobject]@{}) `
              -Force
          }

          $gallery = $product.extensionsGallery
          $gallery | Add-Member -NotePropertyName serviceUrl -NotePropertyValue "https://open-vsx.org/vscode/gallery" -Force
          $gallery | Add-Member -NotePropertyName itemUrl -NotePropertyValue "https://open-vsx.org/vscode/item" -Force
          $gallery | Add-Member -NotePropertyName resourceUrlTemplate -NotePropertyValue "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}" -Force
          $gallery | Add-Member -NotePropertyName extensionUrlTemplate -NotePropertyValue "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest" -Force

          $trustedDomains = @($product.linkProtectionTrustedDomains | Where-Object { $_ })
          if ($trustedDomains -notcontains "https://open-vsx.org") {
            $trustedDomains += "https://open-vsx.org"
          }
          $product | Add-Member `
            -NotePropertyName linkProtectionTrustedDomains `
            -NotePropertyValue $trustedDomains `
            -Force

          # Product-level cap keeps built-in/participating telemetry disabled even if a setting is changed.
          $product | Add-Member `
            -NotePropertyName enabledTelemetryLevels `
            -NotePropertyValue ([pscustomobject]@{ error = $false; usage = $false }) `
            -Force

          $product |
            ConvertTo-Json -Depth 100 |
            Set-Content $file -Encoding utf8

      - name: Set privacy-preserving configuration defaults
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Replace-ExactlyOnce {
            param(
              [Parameter(Mandatory = $true)][string]$File,
              [Parameter(Mandatory = $true)][string]$Pattern,
              [Parameter(Mandatory = $true)][string]$Replacement
            )

            if (-not (Test-Path $File -PathType Leaf)) {
              throw "Expected upstream source file not found: $File"
            }

            $source = [System.IO.File]::ReadAllText($File)
            $regex = [regex]::new($Pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)
            $matches = $regex.Matches($source)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one setting default match in $File but found $($matches.Count). Upstream source may have changed."
            }

            $source = $regex.Replace($source, $Replacement, 1)
            [System.IO.File]::WriteAllText($File, $source, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Patched default in $File"
          }

          Replace-ExactlyOnce `
            "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts" `
            "('extensions\.autoUpdate'\s*:\s*\{.*?\bdefault:\s*)'on'" `
            ('$1' + "'off'")

          Replace-ExactlyOnce `
            "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts" `
            "('extensions\.autoCheckUpdates'\s*:\s*\{.*?\bdefault:\s*)true" `
            '$1false'

          Replace-ExactlyOnce `
            "src/vs/platform/update/common/update.config.contribution.ts" `
            "('update\.mode'\s*:\s*\{.*?\bdefault:\s*)'default'" `
            ('$1' + "'none'")

          Replace-ExactlyOnce `
            "src/vs/platform/update/common/update.config.contribution.ts" `
            "('update\.showReleaseNotes'\s*:\s*\{.*?\bdefault:\s*)true" `
            '$1false'

          Replace-ExactlyOnce `
            "src/vs/platform/telemetry/common/telemetryService.ts" `
            "(\[TELEMETRY_SETTING_ID\]\s*:\s*\{.*?'default'\s*:\s*)TelemetryConfiguration\.ON" `
            '$1TelemetryConfiguration.OFF'

          Replace-ExactlyOnce `
            "src/vs/platform/telemetry/common/telemetryService.ts" `
            "(\[TELEMETRY_OLD_SETTING_ID\]\s*:\s*\{.*?'default'\s*:\s*)true" `
            '$1false'

      - name: Build application
        working-directory: vscode
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gulp ${{ matrix.task }}

      - name: Inspect build output
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Workspace: $PWD"
          Write-Host "Expected output: $env:OUTPUT_DIR"

          Write-Host "`nWorkspace directories:"
          Get-ChildItem -Directory -Force |
            Select-Object Name, FullName

          Write-Host "`nRepository root directories:"
          Get-ChildItem vscode -Directory -Force |
            Select-Object Name, FullName

          $expected = Join-Path $PWD $env:OUTPUT_DIR

          if (Test-Path $expected -PathType Container) {
            Write-Host "Found expected output: $expected"
          } else {
            Write-Host "Expected output not found at workspace root."

            $candidate = Join-Path (Join-Path $PWD "vscode") $env:OUTPUT_DIR

            if (Test-Path $candidate -PathType Container) {
              Write-Host "Found output inside checkout: $candidate"
            } else {
              Write-Host "Searching for matching output directories..."

              $matches = Get-ChildItem vscode -Directory -Recurse -Force `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -eq $env:OUTPUT_DIR }

              if ($matches) {
                $matches | Select-Object FullName
              } else {
                Write-Host "No directory named $env:OUTPUT_DIR was found."
              }
            }
          }

      - name: Resolve build output directory
        id: package
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            (Join-Path $PWD $env:OUTPUT_DIR),
            (Join-Path (Join-Path $PWD "vscode") $env:OUTPUT_DIR)
          )

          $package = $null

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate -PathType Container) {
              $package = (Resolve-Path $candidate).Path
              break
            }
          }

          if (-not $package) {
            throw "Build output '$env:OUTPUT_DIR' was not found in the workspace or checkout. See the Inspect build output step."
          }

          "path=$package" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved package directory: $package"

      - name: Verify bundled Chat extension is retained
        shell: pwsh
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = Join-Path $env:PACKAGE_DIR "resources/app/extensions/copilot/package.json"

          if (-not (Test-Path $manifestPath -PathType Leaf)) {
            throw "Bundled Chat extension manifest was not found at '$manifestPath'."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.publisher -ne "GitHub" -or $manifest.name -ne "copilot-chat") {
            throw "Unexpected Chat extension manifest at '$manifestPath'."
          }

          $productPath = Join-Path $env:PACKAGE_DIR "resources/app/product.json"
          $product = Get-Content $productPath -Raw | ConvertFrom-Json
          if (-not $product.defaultChatAgent) {
            throw "Standard edition is missing defaultChatAgent product metadata."
          }

          $compiledFiles = Get-ChildItem (Join-Path $env:PACKAGE_DIR "resources/app/extensions/copilot") -Recurse -File |
            Where-Object { $_.Extension -in @(".js", ".mjs", ".cjs") }
          foreach ($file in $compiledFiles) {
            if (Select-String -Path $file.FullName -SimpleMatch "https://main.vscode-cdn.net/extensions/copilotChat.json" -Quiet) {
              throw "Runtime Microsoft model-catalogue URL remains in packaged file '$($file.FullName)'."
            }
          }

          Write-Host "Standard edition retains bundled Chat/BYOK and loads the known-model catalogue locally."

      - name: Archive standard Linux build
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.path }}
          ARCHIVE: ${{ matrix.archive_standard }}
        run: |
          set -euo pipefail
          test -d "$PACKAGE_DIR"
          tar -czf "$ARCHIVE" -C "$(dirname "$PACKAGE_DIR")" "$(basename "$PACKAGE_DIR")"
          test -s "$ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Archive standard Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.path }}
          ARCHIVE: ${{ matrix.archive_standard }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path $env:PACKAGE_DIR -PathType Container)) {
            throw "Standard package directory not found: $env:PACKAGE_DIR"
          }
          if (Test-Path $env:ARCHIVE) { Remove-Item $env:ARCHIVE -Force }
          Compress-Archive -Path $env:PACKAGE_DIR -DestinationPath $env:ARCHIVE -CompressionLevel Optimal
          if (-not (Test-Path $env:ARCHIVE -PathType Leaf) -or (Get-Item $env:ARCHIVE).Length -eq 0) {
            throw "Standard archive was not created or is empty: $env:ARCHIVE"
          }
          Write-Host "Created standard archive: $env:ARCHIVE"

      - name: Remove user-facing AI feature entry points from no-AI source
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Do not remove shared chat/agent service registrations from the
          # core workbench entry points. Those singleton registrations can be
          # consumed during startup by code outside the visible Chat UI; pruning
          # them too aggressively can compile successfully but leave a blank
          # renderer window at runtime.
          #
          # Instead, remove the user-facing feature contribution roots. The
          # Copilot extension and the dedicated Agents/Sessions bundle are
          # removed from the shipped no-AI package in later steps.
          $targets = @{
            "src/vs/workbench/workbench.common.main.ts" = @(
              "/contrib/chat/",
              "/contrib/inlineChat/",
              "/contrib/agentsVoice/",
              "/contrib/welcomeAgentSessions/",
              "/contrib/remoteCodingAgents/",
              "/contrib/mcp/",
              "/contrib/speech/",
              "/contrib/imageCarousel/"
            )
            "src/vs/workbench/workbench.desktop.main.ts" = @(
              "/contrib/chat/",
              "/contrib/agentsVoice/",
              "/contrib/mcp/"
            )
            "src/vs/workbench/workbench.web.main.ts" = @(
              "/contrib/chat/",
              "/contrib/inlineChat/",
              "/contrib/agentsVoice/",
              "/contrib/welcomeAgentSessions/",
              "/contrib/remoteCodingAgents/",
              "/contrib/mcp/",
              "/contrib/speech/",
              "/contrib/imageCarousel/"
            )
            "src/vs/workbench/contrib/codeEditor/browser/codeEditor.contribution.ts" = @(
              "/emptyTextEditorHint/emptyTextEditorHint.js",
              "/dictation/editorDictation.js"
            )
          }

          $minimums = @{
            "src/vs/workbench/workbench.common.main.ts" = 3
            "src/vs/workbench/workbench.desktop.main.ts" = 1
            "src/vs/workbench/workbench.web.main.ts" = 1
            "src/vs/workbench/contrib/codeEditor/browser/codeEditor.contribution.ts" = 1
          }

          $removedTotal = 0
          foreach ($relativePath in $targets.Keys) {
            if (-not (Test-Path $relativePath -PathType Leaf)) {
              throw "Expected entry point not found: $relativePath. Upstream layout changed."
            }

            $fullPath = (Resolve-Path $relativePath).Path
            $source = [System.IO.File]::ReadAllText($fullPath) -replace "`r`n", "`n"
            $removedImports = 0

            foreach ($fragment in $targets[$relativePath]) {
              $escapedFragment = [regex]::Escape($fragment)
              $importPattern = '(?m)^[ \t]*import\b[^;]*' + $escapedFragment + '[^;]*;[ \t]*(?:\r?\n)?'
              $matches = [regex]::Matches($source, $importPattern)
              if ($matches.Count -gt 0) {
                $removedImports += $matches.Count
                $source = [regex]::Replace($source, $importPattern, '')
              }
            }

            if ($removedImports -lt $minimums[$relativePath]) {
              throw "Removed only $removedImports feature imports from $relativePath; expected at least $($minimums[$relativePath]). Upstream may have changed."
            }

            foreach ($fragment in $targets[$relativePath]) {
              $escapedFragment = [regex]::Escape($fragment)
              $remainingImportPattern = '(?m)^[ \t]*import\b[^;]*' + $escapedFragment + '[^;]*;'
              if ([regex]::IsMatch($source, $remainingImportPattern)) {
                throw "AI feature import remains in $relativePath matching '$fragment'."
              }
            }

            [System.IO.File]::WriteAllText($fullPath, $source, [System.Text.UTF8Encoding]::new($false))
            $removedTotal += $removedImports
            Write-Host "$relativePath`: removed $removedImports user-facing AI feature imports; retained shared service registrations."
          }

          if ($removedTotal -lt 6) {
            throw "Only $removedTotal AI feature imports were removed; expected at least 6. Upstream may have changed."
          }

          # Remove the extension-host inline-chat command API as well. The API
          # registration is independent of the main workbench UI contribution.
          $apiPath = "src/vs/workbench/api/common/extHostApiCommands.ts"
          if (-not (Test-Path $apiPath -PathType Leaf)) {
            throw "Expected extension-host API source not found: $apiPath"
          }
          $apiSource = [System.IO.File]::ReadAllText($apiPath) -replace "`r`n", "`n"
          $inlineApiPattern = '(?s)// --- inline chat\s+new ApiCommand\(\s*''vscode\.editorChat\.start''\s*,\s*''inlineChat\.start''.*?ApiCommandResult\.Void\s*\)\s*,\s*(?=// --- extension prompt files)'
          $inlineApiMatches = [regex]::Matches($apiSource, $inlineApiPattern).Count
          if ($inlineApiMatches -ne 1) {
            throw "Expected exactly one extension-host inline-chat API registration in $apiPath; found $inlineApiMatches. Upstream changed."
          }
          $apiSource = ([regex]::new($inlineApiPattern)).Replace($apiSource, '', 1)

          $inlineTypesPattern = '(?s)type InlineChatEditorApiArg\s*=\s*\{.*?\};\s*type InlineChatRunOptions\s*=\s*\{.*?\};'
          $inlineTypesMatches = [regex]::Matches($apiSource, $inlineTypesPattern).Count
          if ($inlineTypesMatches -ne 1) {
            throw "Expected exactly one inline-chat API type block in $apiPath; found $inlineTypesMatches. Upstream changed."
          }
          $apiSource = ([regex]::new($inlineTypesPattern)).Replace($apiSource, '', 1)

          if ($apiSource -match 'vscode\.editorChat\.start|inlineChat\.start|InlineChatEditorApiArg|InlineChatRunOptions') {
            throw "Inline-chat extension-host API identifiers remain in $apiPath after patching."
          }
          [System.IO.File]::WriteAllText($apiPath, $apiSource, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Removed the inline-chat extension-host API while preserving the shared workbench service registrations required for startup."
      - name: Strip Copilot-specific product configuration for no-AI build
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "product.json"
          $product = Get-Content $file -Raw | ConvertFrom-Json

          $propertiesToRemove = @(
            "copilotVersions",
            "agentSdks",
            "mcpGallery",
            "aiConfig",
            "chatParticipantRegistry",
            "chatSessionRecommendations",
            "agentsTelemetryAppName",
            "trustedMcpAuthAccess",
            "aiGeneratedWorkspaceTrust",
            "voiceWsUrl",
            "settingsSearchUrl",
            "settingsSearchBuildId",
            "dictationRuntime",
            "sessionsWindowAllowedExtensions"
          )
          foreach ($propertyName in $propertiesToRemove) {
            if ($null -ne $product.PSObject.Properties[$propertyName]) {
              [void]$product.PSObject.Properties.Remove($propertyName)
              Write-Host "Removed product metadata: $propertyName"
            }
          }

          # Remove Copilot references from extension-related product dictionaries.
          foreach ($dictionaryName in @(
            "trustedExtensionAuthAccess",
            "extensionConfigurationPolicy",
            "extensionEnabledApiProposals",
            "extensionKind",
            "extensionSyncedKeys",
            "extensionUntrustedWorkspaceSupport",
            "extensionVirtualWorkspacesSupport",
            "extensionProperties"
          )) {
            $dictionary = $product.PSObject.Properties[$dictionaryName]
            if ($null -eq $dictionary -or $null -eq $dictionary.Value) { continue }
            foreach ($key in @($dictionary.Value.PSObject.Properties.Name)) {
              if ($key -match '(?i)copilot') {
                [void]$dictionary.Value.PSObject.Properties.Remove($key)
              } else {
                $entry = $dictionary.Value.PSObject.Properties[$key]
                if ($null -ne $entry.Value -and $entry.Value -is [array]) {
                  $filtered = @($entry.Value | Where-Object { "$($_)" -notmatch '(?i)copilot' })
                  if ($filtered.Count -eq 0) {
                    [void]$dictionary.Value.PSObject.Properties.Remove($key)
                  } else {
                    $dictionary.Value | Add-Member -NotePropertyName $key -NotePropertyValue $filtered -Force
                  }
                }
              }
            }
          }

          if ($null -ne $product.remoteDefaultExtensionsIfInstalledLocally) {
            $product.remoteDefaultExtensionsIfInstalledLocally = @(
              $product.remoteDefaultExtensionsIfInstalledLocally | Where-Object { "$_" -notmatch '(?i)copilot' }
            )
          }
          if ($null -ne $product.builtInExtensions) {
            $product.builtInExtensions = @(
              $product.builtInExtensions | Where-Object { "$($_.name)" -notmatch '(?i)copilot' }
            )
          }
          $product | Add-Member -NotePropertyName builtInExtensionsEnabledWithAutoUpdates -NotePropertyValue @() -Force

          # Give this edition a separate identity and data directory so it
          # cannot silently re-load Copilot extensions installed by the
          # standard edition in the same user profile.
          $identity = @{
            nameShort = "Code - OSS (No AI)"
            nameLong = "Code - OSS (No AI)"
            applicationName = "code-oss-no-ai"
            dataFolderName = ".vscode-oss-no-ai"
            sharedDataFolderName = ".vscode-oss-no-ai-shared"
            urlProtocol = "code-oss-no-ai"
            win32MutexName = "codeossnoai"
            win32SetupMutexName = "codeossnoaisetup"
            win32RegValueName = "CodeOSSNoAI"
            win32NameVersion = "Code - OSS No AI"
            win32DirName = "Code - OSS No AI"
            win32AppUserModelId = "CodeOSSNoAI"
            linuxDesktopName = "code-oss-no-ai"
            serverApplicationName = "code-server-oss-no-ai"
            serverDataFolderName = ".vscode-server-oss-no-ai"
            tunnelApplicationName = "code-tunnel-oss-no-ai"
          }
          foreach ($entry in $identity.GetEnumerator()) {
            $product | Add-Member -NotePropertyName $entry.Key -NotePropertyValue $entry.Value -Force
          }

          $serialized = $product | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($file, $serialized + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

          $written = Get-Content $file -Raw | ConvertFrom-Json
          foreach ($propertyName in $propertiesToRemove) {
            if ($null -ne $written.PSObject.Properties[$propertyName]) {
              throw "No-AI source product.json still contains '$propertyName'."
            }
          }
          if ($written.dataFolderName -ne ".vscode-oss-no-ai" -or $written.applicationName -ne "code-oss-no-ai") {
            throw "No-AI profile isolation settings were not written correctly."
          }
          Write-Host "No-AI product metadata stripped and profile isolated."

      - name: Remove Copilot SDK fallback from no-AI runtime
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourcePath = "src/vs/platform/product/common/product.ts"
          if (-not (Test-Path $sourcePath -PathType Leaf)) {
            throw "Product runtime source not found: $sourcePath"
          }
          $source = [System.IO.File]::ReadAllText($sourcePath) -replace "`r`n", "`n"

          # Remove the helper that derives Copilot versions from package.json.
          $helperMarker = "function getDependencyVersion("
          if ([regex]::Matches($source, [regex]::Escape($helperMarker)).Count -ne 1) {
            throw "Could not find exactly one getDependencyVersion helper in $sourcePath."
          }
          $helperStart = $source.IndexOf($helperMarker)
          $helperEnd = $source.IndexOf("`n}", $helperStart)
          if ($helperEnd -lt 0) { throw "Could not locate end of getDependencyVersion helper." }
          $source = $source.Remove($helperStart, ($helperEnd + 2) - $helperStart)

          # Remove the startup fallback that repopulates product.copilotVersions
          # from the packaged @github/copilot-sdk dependency.
          $blockMarker = "if (!product.copilotVersions) {"
          if ([regex]::Matches($source, [regex]::Escape($blockMarker)).Count -ne 1) {
            throw "Could not find exactly one Copilot version fallback in $sourcePath."
          }
          $blockStart = $source.IndexOf($blockMarker)
          $braceStart = $source.IndexOf("{", $blockStart)
          $depth = 0
          $blockEnd = -1
          for ($i = $braceStart; $i -lt $source.Length; $i++) {
            if ($source[$i] -eq '{') { $depth++ }
            elseif ($source[$i] -eq '}') {
              $depth--
              if ($depth -eq 0) { $blockEnd = $i; break }
            }
          }
          if ($blockEnd -lt 0) { throw "Could not find end of Copilot version fallback block." }
          $source = $source.Remove($blockStart, ($blockEnd + 1) - $blockStart)
          $source = [regex]::Replace($source, '(?m)^\s*readonly copilotRuntimeVersion\?: string;\n', '')

          if ($source.Contains($blockMarker) -or $source.Contains("copilotVersions:")) {
            throw "Copilot version fallback still exists in $sourcePath after patching."
          }
          [System.IO.File]::WriteAllText($sourcePath, $source, [System.Text.UTF8Encoding]::new($false))

          # The build tooling still validates package.json.copilotRuntimeVersion
          # against the installed SDK at gulp startup. Keep that build-time version
          # pin, but remove the SDK dependency from the no-AI app manifest used by
          # getProductionDependencies so it is not shipped.
          $packagePath = "package.json"
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$package.copilotRuntimeVersion)) {
            throw "Upstream package.json no longer declares copilotRuntimeVersion; update the no-AI build compatibility patch."
          }
          foreach ($dependencyField in @("dependencies", "optionalDependencies")) {
            $dependenciesProperty = $package.PSObject.Properties[$dependencyField]
            if ($null -eq $dependenciesProperty -or $null -eq $dependenciesProperty.Value) { continue }
            foreach ($dependencyName in @($dependenciesProperty.Value.PSObject.Properties.Name)) {
              if ($dependencyName -match '^@github/copilot-sdk(?:-|$)') {
                [void]$dependenciesProperty.Value.PSObject.Properties.Remove($dependencyName)
                Write-Host "Removed build-package dependency declaration: $dependencyName"
              }
            }
          }
          # Deliberately retain copilotRuntimeVersion above for the gulpfile's
          # build-time consistency check. It is removed from the packaged app later.
          $packageJson = $package | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($packagePath, $packageJson + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

          # Patch the packaging gulpfile for this second build only: keep its
          # top-level version validator working, but do not stamp Copilot/agent
          # metadata or copy Copilot SDK runtime packages into the no-AI product.
          $gulpfilePath = "build/gulpfile.vscode.ts"
          $gulpSource = [System.IO.File]::ReadAllText($gulpfilePath) -replace "`r`n", "`n"

          $copilotVersionsPattern = '(?m)^([ \t]*)json\.copilotVersions\s*=\s*\{\s*\n[ \t]*runtime:\s*copilotRuntimeVersion,\s*\n[ \t]*sdk:\s*getLockedPackageVersion\(''@github/copilot-sdk''\),\s*\n[ \t]*\};'
          if ([regex]::Matches($gulpSource, $copilotVersionsPattern).Count -ne 1) {
            throw "Could not locate exactly one copilotVersions packaging block in $gulpfilePath."
          }
          $gulpSource = [regex]::Replace($gulpSource, $copilotVersionsPattern, '$1delete json.copilotVersions;', 1)

          $agentSdkAssignment = 'json.agentSdks = agentSdks;'
          if ([regex]::Matches($gulpSource, [regex]::Escape($agentSdkAssignment)).Count -ne 1) {
            throw "Could not locate exactly one agentSdks product-stamping assignment in $gulpfilePath."
          }
          $gulpSource = $gulpSource.Replace($agentSdkAssignment, 'delete json.agentSdks;')

          $dictationAssignment = 'json.dictationRuntime = dictationRuntime;'
          if ([regex]::Matches($gulpSource, [regex]::Escape($dictationAssignment)).Count -ne 1) {
            throw "Could not locate exactly one dictationRuntime product-stamping assignment in $gulpfilePath."
          }
          $gulpSource = $gulpSource.Replace($dictationAssignment, 'delete json.dictationRuntime;')

          $prebuildLine = "const copilotRuntimePrebuilds = gulp.src(getCopilotRuntimePrebuildFiles(platform, arch), { base: '.', dot: true, allowEmpty: true });"
          if ([regex]::Matches($gulpSource, [regex]::Escape($prebuildLine)).Count -ne 1) {
            throw "Could not locate exactly one Copilot SDK prebuild packaging line in $gulpfilePath."
          }
          $gulpSource = $gulpSource.Replace($prebuildLine, "const copilotRuntimePrebuilds = process.env['CODE_OSS_NO_AI_BUILD'] === '1' ? es.readArray([]) : gulp.src(getCopilotRuntimePrebuildFiles(platform, arch), { base: '.', dot: true, allowEmpty: true });")

          $ensureLine = 'ensureCopilotPlatformPackage(platform, arch);'
          if ([regex]::Matches($gulpSource, [regex]::Escape($ensureLine)).Count -ne 1) {
            throw "Could not locate exactly one ensureCopilotPlatformPackage call in $gulpfilePath."
          }
          $gulpSource = $gulpSource.Replace($ensureLine, "if (process.env['CODE_OSS_NO_AI_BUILD'] !== '1') { ensureCopilotPlatformPackage(platform, arch); }")

          $productionLine = 'const productionDependencies = getProductionDependencies(root);'
          if ([regex]::Matches($gulpSource, [regex]::Escape($productionLine)).Count -ne 1) {
            throw "Could not locate exactly one production-dependency selection line in $gulpfilePath."
          }
          $productionReplacement = @'
          const productionDependencies = getProductionDependencies(root).filter(dependencyPath => {
            if (process.env['CODE_OSS_NO_AI_BUILD'] !== '1') {
              return true;
            }
            const normalizedPath = dependencyPath.replace(/\\/g, '/');
            return !/(^|\/)node_modules\/@github\/copilot-sdk(?:-[^/]+)?(?:\/|$)/i.test(normalizedPath);
          });
          '@
          $productionReplacement = $productionReplacement.Trim()
          $gulpSource = $gulpSource.Replace($productionLine, $productionReplacement)

          if ($gulpSource.Contains('json.copilotVersions =') -or
              $gulpSource.Contains('json.agentSdks = agentSdks;') -or
              $gulpSource.Contains('json.dictationRuntime = dictationRuntime;')) {
            throw "No-AI product metadata stamping remains in $gulpfilePath."
          }
          [System.IO.File]::WriteAllText($gulpfilePath, $gulpSource, [System.Text.UTF8Encoding]::new($false))

          $verified = [System.IO.File]::ReadAllText($sourcePath)
          if ($verified.Contains($blockMarker) -or $verified.Contains("copilotVersions:")) {
            throw "Product runtime source still contains Copilot runtime-version logic."
          }
          Write-Host "Removed runtime Copilot fallback and patched no-AI packaging while preserving build-time SDK version validation."

      - name: Rebuild application without Chat and agent functionality
        working-directory: vscode
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
          CODE_OSS_NO_AI_BUILD: '1'
        run: npm run gulp ${{ matrix.task }}

      - name: Resolve no-AI build output directory
        id: no-ai-package
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            (Join-Path $PWD $env:OUTPUT_DIR),
            (Join-Path (Join-Path $PWD "vscode") $env:OUTPUT_DIR)
          )
          $package = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate -PathType Container) {
              $package = (Resolve-Path $candidate).Path
              break
            }
          }
          if (-not $package) {
            throw "No-AI build output '$env:OUTPUT_DIR' was not found after recompilation."
          }
          "path=$package" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved no-AI package directory: $package"

      - name: Remove bundled AI extensions and verify no-AI package
        shell: pwsh
        env:
          PACKAGE_DIR: ${{ steps.no-ai-package.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"

          # The Agents/Sessions app is emitted as a separate bundle, outside
          # the main workbench entrypoints. Remove that compiled runtime from
          # the no-AI edition only. The standard archive was already created
          # and must retain the upstream Sessions feature.
          $sessionsBundle = Join-Path $env:PACKAGE_DIR "resources/app/out/vs/sessions"
          if (Test-Path $sessionsBundle -PathType Container) {
            Remove-Item $sessionsBundle -Recurse -Force
            Write-Host "Removed compiled Agents/Sessions runtime from no-AI package."
          }
          if (Test-Path $sessionsBundle) {
            throw "Agents/Sessions runtime remains in no-AI package: $sessionsBundle"
          }
          $remainingSessions = Get-ChildItem $env:PACKAGE_DIR -Filter "sessions.desktop.main.js" -Recurse -File -ErrorAction SilentlyContinue
          if ($remainingSessions) {
            throw "Agents/Sessions entrypoint remains in no-AI package: $($remainingSessions[0].FullName)"
          }

          # Some upstream tags may package this SDK separately from the
          # extension. Remove it from the no-AI distribution if present.
          $sdkCandidates = @(
            (Join-Path $env:PACKAGE_DIR "resources/app/node_modules/@github/copilot-sdk"),
            (Join-Path $env:PACKAGE_DIR "node_modules/@github/copilot-sdk")
          )
          foreach ($sdkPath in $sdkCandidates) {
            if (Test-Path $sdkPath -PathType Container) {
              Remove-Item $sdkPath -Recurse -Force
              Write-Host "Removed packaged Copilot SDK: $sdkPath"
            }
          }

          $extensions = Join-Path $env:PACKAGE_DIR "resources/app/extensions"
          if (-not (Test-Path $extensions -PathType Container)) {
            throw "Packaged extensions directory is missing: $extensions"
          }

          foreach ($extensionDir in Get-ChildItem $extensions -Directory -Force) {
            $remove = $false
            foreach ($manifestFile in Get-ChildItem $extensionDir.FullName -Filter package.json -Recurse -File -ErrorAction SilentlyContinue) {
              try {
                $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
                $publisher = "$($manifest.publisher)"
                $name = "$($manifest.name)"
                if (($publisher -match '(?i)github' -and $name -match '(?i)copilot') -or
                    "$publisher.$name" -match '(?i)github\.copilot') {
                  $remove = $true
                  Write-Host "Removing bundled AI extension: $publisher.$name ($($extensionDir.Name))"
                  break
                }
              } catch {
                throw "Could not inspect extension manifest '$($manifestFile.FullName)': $($_.Exception.Message)"
              }
            }
            if ($remove) { Remove-Item $extensionDir.FullName -Recurse -Force }
          }

          $sdkPath = Join-Path $env:PACKAGE_DIR "resources/app/node_modules/@github/copilot-sdk"
          if (Test-Path $sdkPath -PathType Container) { Remove-Item $sdkPath -Recurse -Force }
          if (Test-Path $sdkPath) { throw "Copilot SDK package remains in no-AI app: $sdkPath" }

          # Check the packed production dependencies too. Most app dependencies
          # are stored inside node_modules.asar rather than as loose directories.
          $asarPath = Join-Path $env:PACKAGE_DIR "resources/app/node_modules.asar"
          if (Test-Path $asarPath -PathType Leaf) {
            $env:CODE_OSS_NODE_MODULES_ASAR = $asarPath
            $env:CODE_OSS_ASAR_MODULE = Join-Path $PWD "vscode/node_modules/asar"
            $asarScanScript = @'
          const asar = require(process.env.CODE_OSS_ASAR_MODULE);
          const entries = asar.listPackage(process.env.CODE_OSS_NODE_MODULES_ASAR);
          const forbidden = entries.filter((entry) =>
            /(^|\/)@github\/copilot-sdk(?:-[^/]+)?(?:\/|$)/i.test(entry)
          );
          if (forbidden.length) {
            console.error("Copilot SDK entries remain in node_modules.asar:");
            console.error(forbidden.slice(0, 30).join("\n"));
            process.exit(1);
          }
          console.log("No Copilot SDK packages found in node_modules.asar.");
          '@
            $asarScanScript | node
            if ($LASTEXITCODE -ne 0) {
              throw "Copilot SDK content remains in the no-AI node_modules.asar archive."
            }
          }

          $unpackedGithub = Join-Path $env:PACKAGE_DIR "resources/app/node_modules.asar.unpacked/@github"
          if (Test-Path $unpackedGithub -PathType Container) {
            $unpackedSdk = Get-ChildItem $unpackedGithub -Directory -Force |
              Where-Object { $_.Name -match '^copilot-sdk(?:-|$)' }
            if ($unpackedSdk) {
              throw "Copilot SDK native/runtime package remains unpacked: $($unpackedSdk[0].FullName)"
            }
          }

          $productPath = Join-Path $env:PACKAGE_DIR "resources/app/product.json"
          $product = Get-Content $productPath -Raw | ConvertFrom-Json
          $forbiddenProperties = @(
            "copilotVersions", "agentSdks", "mcpGallery",
            "aiConfig", "chatParticipantRegistry", "chatSessionRecommendations",
            "agentsTelemetryAppName", "trustedMcpAuthAccess", "aiGeneratedWorkspaceTrust", "voiceWsUrl",
            "settingsSearchUrl", "settingsSearchBuildId", "dictationRuntime", "sessionsWindowAllowedExtensions"
          )
          foreach ($propertyName in $forbiddenProperties) {
            if ($null -ne $product.PSObject.Properties[$propertyName]) {
              throw "No-AI packaged product.json still contains '$propertyName'."
            }
          }
          if ($product.applicationName -ne "code-oss-no-ai" -or $product.dataFolderName -ne ".vscode-oss-no-ai") {
            throw "No-AI package does not have an isolated application/profile identity."
          }
          $appPackagePath = Join-Path $env:PACKAGE_DIR "resources/app/package.json"
          if (Test-Path $appPackagePath -PathType Leaf) {
            $appPackage = Get-Content $appPackagePath -Raw | ConvertFrom-Json
            if ($null -ne $appPackage.PSObject.Properties["copilotRuntimeVersion"]) {
              [void]$appPackage.PSObject.Properties.Remove("copilotRuntimeVersion")
            }
            foreach ($dependencyField in @("dependencies", "optionalDependencies")) {
              $dependenciesProperty = $appPackage.PSObject.Properties[$dependencyField]
              if ($null -eq $dependenciesProperty -or $null -eq $dependenciesProperty.Value) { continue }
              foreach ($dependencyName in @($dependenciesProperty.Value.PSObject.Properties.Name)) {
                if ($dependencyName -match '^@github/copilot-sdk(?:-|$)') {
                  [void]$dependenciesProperty.Value.PSObject.Properties.Remove($dependencyName)
                }
              }
            }
            $appPackageJson = $appPackage | ConvertTo-Json -Depth 100
            [System.IO.File]::WriteAllText($appPackagePath, $appPackageJson + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
            $appPackage = Get-Content $appPackagePath -Raw | ConvertFrom-Json
            if ($null -ne $appPackage.PSObject.Properties["copilotRuntimeVersion"]) {
              throw "Packaged app package.json still advertises copilotRuntimeVersion after sanitization."
            }
            foreach ($dependencyField in @("dependencies", "optionalDependencies")) {
              $dependenciesProperty = $appPackage.PSObject.Properties[$dependencyField]
              if ($null -ne $dependenciesProperty -and $null -ne $dependenciesProperty.Value) {
                foreach ($dependencyName in @($dependenciesProperty.Value.PSObject.Properties.Name)) {
                  if ($dependencyName -match '^@github/copilot-sdk(?:-|$)') {
                    throw "Packaged app still declares Copilot SDK dependency '$dependencyName'."
                  }
                }
              }
            }
          }

          $remainingManifests = Get-ChildItem $extensions -Filter package.json -Recurse -File -ErrorAction SilentlyContinue
          foreach ($manifestFile in $remainingManifests) {
            $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
            if ("$($manifest.publisher).$($manifest.name)" -match '(?i)github\.copilot') {
              throw "Copilot extension remains in no-AI package: $($manifestFile.FullName)"
            }
          }

          $bundleRoot = Join-Path $env:PACKAGE_DIR "resources/app/out"
          if (-not (Test-Path $bundleRoot -PathType Container)) {
            throw "Compiled workbench bundle directory is missing: $bundleRoot"
          }
          $bundleFiles = Get-ChildItem $bundleRoot -Recurse -File -Include "*.js", "*.mjs", "*.cjs"
          # The remote catalogue URL is a strong runtime/network marker. Command
          # identifiers alone are not reliable proof that AI implementation code
          # is bundled, so validate the inline-chat API registration specifically
          # in the extension-host process and do not fail on unrelated command IDs.
          $forbiddenRuntimeMarkers = @(
            "https://main.vscode-cdn.net/extensions/copilotChat.json"
          )
          foreach ($bundle in $bundleFiles) {
            foreach ($marker in $forbiddenRuntimeMarkers) {
              if (Select-String -Path $bundle.FullName -SimpleMatch $marker -Quiet) {
                throw "AI network runtime marker '$marker' remains in no-AI compiled bundle '$($bundle.FullName)'. The upstream dependency graph may have changed."
              }
            }
          }

          $extensionHostBundle = Join-Path $bundleRoot "vs/workbench/api/node/extensionHostProcess.js"
          if ((Test-Path $extensionHostBundle -PathType Leaf) -and
              (Select-String -Path $extensionHostBundle -SimpleMatch "inlineChat.start" -Quiet)) {
            throw "Inline-chat extension-host API marker remains in '$extensionHostBundle' after its source registration was removed."
          }
          Write-Host "Verified no bundled Copilot extension, no Agents/Sessions bundle, no Microsoft BYOK catalogue URL, and no inline-chat extension-host API registration in the no-AI package."

      - name: Archive no-AI Linux build
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.no-ai-package.outputs.path }}
          ARCHIVE: ${{ matrix.archive_no_ai }}
        run: |
          set -euo pipefail
          test -d "$PACKAGE_DIR"
          tar -czf "$ARCHIVE" -C "$(dirname "$PACKAGE_DIR")" "$(basename "$PACKAGE_DIR")"
          test -s "$ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Archive no-AI Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_DIR: ${{ steps.no-ai-package.outputs.path }}
          ARCHIVE: ${{ matrix.archive_no_ai }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path $env:PACKAGE_DIR -PathType Container)) {
            throw "No-AI package directory not found: $env:PACKAGE_DIR"
          }
          if (Test-Path $env:ARCHIVE) { Remove-Item $env:ARCHIVE -Force }
          Compress-Archive -Path $env:PACKAGE_DIR -DestinationPath $env:ARCHIVE -CompressionLevel Optimal
          if (-not (Test-Path $env:ARCHIVE -PathType Leaf) -or (Get-Item $env:ARCHIVE).Length -eq 0) {
            throw "No-AI archive was not created or is empty: $env:ARCHIVE"
          }
          Write-Host "Created no-AI archive: $env:ARCHIVE"

      - name: Upload platform archives
        uses: actions/upload-artifact@v7
        with:
          name: code-oss-${{ matrix.platform }}-${{ needs.check.outputs.tag }}
          path: |
            ${{ matrix.archive_standard }}
            ${{ matrix.archive_no_ai }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download platform build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: code-oss-*-${{ needs.check.outputs.tag }}
          path: release-assets
          merge-multiple: true

      - name: Verify archives and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/code-oss-linux-x64.tar.gz
          test -s release-assets/code-oss-linux-x64-no-ai.tar.gz
          test -s release-assets/code-oss-windows-x64.zip
          test -s release-assets/code-oss-windows-x64-no-ai.zip
          sha256sum \
            release-assets/code-oss-linux-x64.tar.gz \
            release-assets/code-oss-linux-x64-no-ai.tar.gz \
            release-assets/code-oss-windows-x64.zip \
            release-assets/code-oss-windows-x64-no-ai.zip \
            > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code - OSS ${{ needs.check.outputs.tag }}
          body: |
            Privacy-hardened Code - OSS builds from the Microsoft VS Code upstream release `${{ needs.check.outputs.tag }}`.

            Upstream source: https://github.com/microsoft/vscode/releases/tag/${{ needs.check.outputs.tag }}

            Included builds:
            - Linux x64, standard with bundled Chat/BYOK: `code-oss-linux-x64.tar.gz`
            - Windows x64, standard with bundled Chat/BYOK: `code-oss-windows-x64.zip`
            - Linux x64, no bundled Copilot/Chat/agent runtime: `code-oss-linux-x64-no-ai.tar.gz`
            - Windows x64, no bundled Copilot/Chat/agent runtime: `code-oss-windows-x64-no-ai.zip`

            The standard edition bundles the BYOK known-model catalogue locally, so it does not fetch `copilotChat.json` from Microsoft's CDN at startup.

            The no-AI edition is separately recompiled after removing the user-facing Chat, inline-Chat, Agents/Voice, MCP, remote-coding-agent and related contribution entry points, plus the AI-based empty-editor hint and inline-chat extension-host API. Shared service registrations are preserved to keep the workbench startup dependency graph intact. The packaged Copilot Chat extension, Copilot SDK package (if packaged separately), and dedicated Agents/Sessions bundle are removed. Nonessential Copilot/AI metadata is stripped while retaining the upstream-required defaultChatAgent compatibility object; the edition has its own application identity and data directory. Users can still install third-party AI extensions from Open VSX unless you choose to block those extensions separately.

            `SHA256SUMS` contains SHA-256 checksums for all four archives.
          files: |
            release-assets/code-oss-linux-x64.tar.gz
            release-assets/code-oss-linux-x64-no-ai.tar.gz
            release-assets/code-oss-windows-x64.zip
            release-assets/code-oss-windows-x64-no-ai.zip
            release-assets/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true

  record:
    needs: [check, build, release]
    if: needs.check.outputs.changed == 'true' && needs.build.result == 'success' && needs.release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Record successfully built release
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail

          echo "$UPSTREAM_TAG" > .upstream-vscode-release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream-vscode-release

          if ! git diff --cached --quiet; then
            git commit -m "chore: record upstream VS Code release"
            git push
          fi
