name: Build VS Code (Windows + Linux)

# Place this file at .github/workflows/build-vscode.yml in YOUR repo.
# It clones microsoft/vscode at an upstream tag, patches product.json
# (Open VSX marketplace + privacy-friendly defaults), builds, packages
# and publishes a GitHub release tagged exactly like the upstream tag.

on:
  schedule:
    - cron: "0 */6 * * *" # poll for new upstream tags every 6 hours
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream microsoft/vscode tag to build (blank = latest stable tag)"
        required: false
        type: string
      force:
        description: "Rebuild even if a release for this tag already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-vscode-${{ inputs.upstream_tag || 'latest' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: microsoft/vscode

jobs:
  # ---------------------------------------------------------------------------
  # 1. Decide which upstream tag to build, and whether we already released it
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve tag and check for an existing release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          URL="https://github.com/${UPSTREAM_REPO}.git"

          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="${INPUT_TAG}"
          else
            # Newest plain X.Y.Z tag (ignores insiders / pre-release style tags)
            TAG="$(git ls-remote --tags --refs "$URL" \
              | awk '{print $2}' | sed 's#refs/tags/##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          fi
          [[ -n "$TAG" ]] || { echo "::error::Could not determine upstream tag"; exit 1; }

          # Make sure the tag really exists upstream and grab its commit
          COMMIT="$(git ls-remote --tags "$URL" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n1 | cut -f1)"
          [[ -n "$COMMIT" ]] || { echo "::error::Tag ${TAG} not found in ${UPSTREAM_REPO}"; exit 1; }

          SHOULD_BUILD=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${FORCE:-false}" != "true" ]]; then
              echo "Release ${TAG} already exists - nothing to do."
              SHOULD_BUILD=false
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: ${TAG} (${COMMIT}) -> build=${SHOULD_BUILD}"

  # ---------------------------------------------------------------------------
  # 2. Build + package on Linux and Windows
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04 # GCC 13: the Electron 43 / V8 headers do not compile with GCC 11 (ubuntu-22.04)
            platform: linux
          - name: win32-x64
            os: windows-2022
            platform: win32
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VSCODE_ARCH: x64
      OUT_DIR: VSCode-${{ matrix.platform }}-x64
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout upstream VS Code @ ${{ needs.prepare.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.prepare.outputs.tag }}
          path: vscode
          fetch-depth: 1

      - name: Setup Node.js (version from upstream .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc

      - name: Setup Python (needed by node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python setuptools
        run: python -m pip install --upgrade pip setuptools

      # ---- Linux prerequisites (from the CONTRIBUTING prerequisites) -------
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ pkg-config python-is-python3 jq \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm dpkg-dev xz-utils gcc-13 g++-13
          # Make node-gyp use a compiler new enough for the Electron/V8 headers
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          gcc-13 --version | head -n1

      # ---- Windows prerequisites ------------------------------------------
      - name: Install MSVC Spectre-mitigated libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $installPath = & "$installerDir\vswhere.exe" -latest -products * -property installationPath
          $vsArgs = @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL.Spectre",
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre",
            "--quiet", "--norestart", "--nocache"
          )
          $p = Start-Process -FilePath "$installerDir\setup.exe" -ArgumentList $vsArgs -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Visual Studio installer failed with exit code $($p.ExitCode)"
          }

      # ---- Customise product.json -----------------------------------------
      # * extensionsGallery -> Open VSX (the FOSS VSIX marketplace)
      # * configurationDefaults -> build-time default values for the settings
      #   (users can still override them in their own settings.json)
      - name: Patch product.json (Open VSX + default settings)
        working-directory: vscode
        run: |
          cp product.json product.json.orig
          jq '
            .extensionsGallery = {
              serviceUrl: "https://open-vsx.org/vscode/gallery",
              itemUrl: "https://open-vsx.org/vscode/item",
              extensionUrlTemplate: "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest",
              resourceUrlTemplate: "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
              controlUrl: "",
              nlsBaseUrl: "",
              publisherUrl: ""
            }
            | .configurationDefaults = ((.configurationDefaults // {}) + {
                "extensions.autoCheckUpdates": false,
                "extensions.autoUpdate": false,
                "update.mode": "none",
                "update.showReleaseNotes": false,
                "telemetry.telemetryLevel": "off",
                "chat.disableAIFeatures": true
              })
          ' product.json.orig > product.json
          rm product.json.orig
          echo "--- patched product.json (relevant keys) ---"
          jq '{extensionsGallery, configurationDefaults}' product.json

      # ---- Install deps ----------------------------------------------------
      - name: npm ci
        working-directory: vscode
        run: |
          ok=0
          for attempt in 1 2; do
            if npm ci; then ok=1; break; fi
            echo "::warning::npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      # ---- Discover which gulp tasks this VS Code version actually has -----
      # Upstream renames build tasks fairly often, so we ask gulp instead of
      # hard-coding names. Helpers live next to (not inside) the vscode folder.
      - name: Discover gulp tasks
        working-directory: vscode
        run: |
          npm run --silent gulp -- --tasks-simple | grep -E '^[A-Za-z0-9:_.-]+$' | sort -u > ../.ci-gulp-tasks.txt
          cat > ../.ci-helpers.sh <<'EOF'
          TASKS_FILE="../.ci-gulp-tasks.txt"
          has_task()   { grep -qxF -- "$1" "$TASKS_FILE"; }
          first_task() { local t; for t in "$@"; do if has_task "$t"; then echo "$t"; return 0; fi; done; return 1; }
          # run the first existing task from the candidates, or fail and show what exists
          need_task() {
            local t
            t="$(first_task "$@")" || {
              echo "::error::None of these gulp tasks exist in this VS Code version: $*"
              echo "Available build-related tasks:"
              grep -E 'compile|minify|core-ci|extension|vscode-|deb|rpm|setup|inno' "$TASKS_FILE" || cat "$TASKS_FILE"
              return 1
            }
            echo "::group::gulp $t"; npm run gulp -- "$t"; echo "::endgroup::"
          }
          # same, but skip quietly if none exist
          opt_task() { if first_task "$@" >/dev/null; then need_task "$@"; else echo "::warning::skipping optional gulp task: $*"; fi; }
          EOF
          echo "$(wc -l < ../.ci-gulp-tasks.txt) gulp tasks found. Build-related ones:"
          grep -E 'compile|minify|core-ci|vscode-(linux|win32)-x64' ../.ci-gulp-tasks.txt || true

      # ---- Compile + package the app (portable directory) -----------------
      - name: Build VS Code
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when gulp downloads built-in extensions
        run: |
          source ../.ci-helpers.sh
          if first_task compile-build-without-mangling compile-build-with-mangling compile-build >/dev/null; then
            need_task compile-build-without-mangling compile-build-with-mangling compile-build
            opt_task  compile-extension-media
            need_task compile-extensions-build
            need_task minify-vscode
          else
            echo "::warning::No compile-build task found; falling back to core-ci-pr / core-ci"
            need_task core-ci-pr core-ci
            need_task compile-extensions-build
          fi
          need_task "vscode-${{ matrix.platform }}-${VSCODE_ARCH}-min-ci" "vscode-${{ matrix.platform }}-${VSCODE_ARCH}-min"

      - name: Verify the built product.json contains our customisations
        run: |
          jq -e '
            .extensionsGallery.serviceUrl == "https://open-vsx.org/vscode/gallery"
            and .configurationDefaults["extensions.autoCheckUpdates"] == false
            and .configurationDefaults["extensions.autoUpdate"] == false
            and .configurationDefaults["update.mode"] == "none"
            and .configurationDefaults["update.showReleaseNotes"] == false
            and .configurationDefaults["telemetry.telemetryLevel"] == "off"
            and .configurationDefaults["chat.disableAIFeatures"] == true
          ' "${OUT_DIR}/resources/app/product.json"

      # ---- Linux packaging: tar.gz (portable), .deb, .rpm ------------------
      - name: Package (Linux) - tar.gz, deb, rpm
        if: runner.os == 'Linux'
        working-directory: vscode
        run: |
          set -euo pipefail
          source ../.ci-helpers.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # Portable archive
          tar --owner=0 --group=0 -czf "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.tar.gz" \
            -C "$GITHUB_WORKSPACE" "$OUT_DIR"

          # Debian / Ubuntu installer
          need_task "vscode-linux-${VSCODE_ARCH}-prepare-deb"
          need_task "vscode-linux-${VSCODE_ARCH}-build-deb"

          # Fedora / RHEL / openSUSE installer
          need_task "vscode-linux-${VSCODE_ARCH}-prepare-rpm"
          need_task "vscode-linux-${VSCODE_ARCH}-build-rpm"

          pick() {
            local f
            f="$(find "$1" -type f -name "$2" | head -n1)"
            [[ -n "$f" ]] || { echo "::error::No $2 found under $1"; exit 1; }
            echo "$f"
          }
          cp "$(pick .build/linux/deb '*.deb')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.deb"
          cp "$(pick .build/linux/rpm '*.rpm')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.rpm"
          ls -lh "$GITHUB_WORKSPACE/dist"

      # ---- Windows packaging: zip (portable), system + user installers -----
      - name: Package (Windows) - zip, system setup, user setup
        if: runner.os == 'Windows'
        working-directory: vscode
        run: |
          set -euo pipefail
          source ../.ci-helpers.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # Installer prerequisites + Inno Setup installers
          need_task "vscode-win32-${VSCODE_ARCH}-inno-updater"
          need_task "vscode-win32-${VSCODE_ARCH}-system-setup"
          need_task "vscode-win32-${VSCODE_ARCH}-user-setup"

          pick() {
            local f
            f="$(find "$1" -type f -name "$2" | head -n1)"
            [[ -n "$f" ]] || { echo "::error::No $2 found under $1"; exit 1; }
            echo "$f"
          }
          cp "$(pick .build/win32-x64/system-setup '*.exe')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64-system-setup.exe"
          cp "$(pick .build/win32-x64/user-setup '*.exe')"   "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64-user-setup.exe"

          # Portable zip (create a "data" folder next to "Code - OSS.exe" to enable portable mode)
          cd "$GITHUB_WORKSPACE/$OUT_DIR"
          7z a -tzip -mx=5 -bd "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64.zip" ./*
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Create the release (only when every build job succeeded)
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code - OSS ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Unofficial build of upstream [`microsoft/vscode` ${{ needs.prepare.outputs.tag }}](https://github.com/microsoft/vscode/tree/${{ needs.prepare.outputs.tag }}) (commit `${{ needs.prepare.outputs.commit }}`).

            **Build-time changes**
            - Extension marketplace: [Open VSX](https://open-vsx.org)
            - Defaults: `extensions.autoCheckUpdates=false`, `extensions.autoUpdate=false`, `update.mode=none`,
              `update.showReleaseNotes=false`, `telemetry.telemetryLevel=off`, `chat.disableAIFeatures=true`
              (users can still change these in their own settings)

            **Downloads**
            | Platform | Installer | Portable |
            |---|---|---|
            | Windows x64 | `*-win32-x64-system-setup.exe`, `*-win32-x64-user-setup.exe` | `*-win32-x64.zip` (add a `data` folder next to `Code - OSS.exe` for portable mode) |
            | Debian / Ubuntu | `*-linux-x64.deb` | `*-linux-x64.tar.gz` |
            | Fedora / RHEL / openSUSE | `*-linux-x64.rpm` | `*-linux-x64.tar.gz` |

            Binaries are unsigned. Verify downloads with `SHA256SUMS.txt`.
