name: Build Privacy-Hardened Code - OSS

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and refresh the release even if this upstream tag was already built
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: upstream-code-oss-release-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Check latest stable upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/vscode/releases/latest" \
            | jq -er '.tag_name // empty')

          test -n "$TAG" || {
            echo "No stable upstream release found" >&2
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          OLD=""
          if [ -f .upstream-vscode-release ]; then
            OLD=$(cat .upstream-vscode-release)
          fi

          if [ "$TAG" != "$OLD" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64

    steps:
      - name: Checkout upstream release
        uses: actions/checkout@v7
        with:
          repository: microsoft/vscode
          ref: ${{ needs.check.outputs.tag }}
          path: vscode
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install Linux build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev python-is-python3 pkg-config \
            fakeroot rpm

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # Code - OSS does not expose a supported product.json field for arbitrary
      # configuration defaults. A tiny built-in extension contributes the defaults
      # so they are included in the Linux and Windows packages alike.
      - name: Configure Open VSX and add privacy defaults
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $productPath = Join-Path $PWD "product.json"
          if (-not (Test-Path $productPath -PathType Leaf)) {
            throw "product.json was not found."
          }

          $product = Get-Content $productPath -Raw | ConvertFrom-Json -AsHashtable

          # The settings default is also contributed by the built-in extension below.
          # These product-level switches additionally disable telemetry collection.
          $product["enableTelemetry"] = $false
          $product["enabledTelemetryLevels"] = @{
            error = $false
            usage = $false
          }

          $product["extensionsGallery"] = @{
            serviceUrl = "https://open-vsx.org/vscode/gallery"
            itemUrl = "https://open-vsx.org/vscode/item"
            resourceUrlTemplate = "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}"
            extensionUrlTemplate = "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          }
          $product["linkProtectionTrustedDomains"] = @("https://open-vsx.org")

          $product | ConvertTo-Json -Depth 100 | Set-Content $productPath -Encoding utf8

          $extensionDir = Join-Path $PWD "extensions/privacy-defaults"
          New-Item -ItemType Directory -Path $extensionDir -Force | Out-Null

          $defaults = @{
            "extensions.autoCheckUpdates" = $false
            "extensions.autoUpdate" = $false
            "update.mode" = "none"
            "update.showReleaseNotes" = $false
            "telemetry.telemetryLevel" = "off"
            "chat.disableAIFeatures" = $true
          }

          $manifest = @{
            name = "privacy-defaults"
            publisher = "privacy-build"
            displayName = "Privacy Defaults"
            description = "Default settings for the privacy-hardened Code - OSS build."
            version = "1.0.0"
            engines = @{ vscode = "^1.50.0" }
            contributes = @{ configurationDefaults = $defaults }
          }

          $manifestPath = Join-Path $extensionDir "package.json"
          $manifest | ConvertTo-Json -Depth 20 | Set-Content $manifestPath -Encoding utf8

          # Fail early if the marketplace or defaults were not written as expected.
          $checkProduct = Get-Content $productPath -Raw | ConvertFrom-Json
          if ($checkProduct.extensionsGallery.serviceUrl -ne "https://open-vsx.org/vscode/gallery") {
            throw "Open VSX configuration was not written correctly."
          }
          $checkManifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($checkManifest.contributes.configurationDefaults.'telemetry.telemetryLevel' -ne "off") {
            throw "Privacy defaults extension manifest was not written correctly."
          }

      - name: Install npm dependencies
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm install

      # The root npm install does not install this extension's own dependency tree.
      # Packaging calls prepareBuiltInCopilotRipgrepShim, which requires
      # extensions/copilot/node_modules/@github/copilot/sdk to exist in the app.
      - name: Install built-in Copilot extension dependencies
        working-directory: vscode/extensions/copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm install

      - name: Verify Copilot SDK dependency
        working-directory: vscode/extensions/copilot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkPath = Join-Path $PWD "node_modules/@github/copilot/sdk"
          if (-not (Test-Path $sdkPath -PathType Container)) {
            throw "Copilot SDK is still missing after npm install: $sdkPath"
          }
          Write-Host "Copilot SDK dependency found at $sdkPath"

      - name: Preserve Copilot SDK metadata and files during dependency packaging
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ignorePath = Join-Path $PWD "build/.moduleignore"
          $sdkPath = Join-Path $PWD "extensions/copilot/node_modules/@github/copilot/sdk"
          $copilotPackageJson = Join-Path $PWD "extensions/copilot/node_modules/@github/copilot/package.json"

          if (-not (Test-Path $sdkPath -PathType Container)) {
            throw "Source Copilot SDK is missing: $sdkPath"
          }
          if (-not (Test-Path $copilotPackageJson -PathType Leaf)) {
            throw "Source Copilot package.json is missing: $copilotPackageJson"
          }
          $copilotPackage = Get-Content $copilotPackageJson -Raw | ConvertFrom-Json
          if (-not $copilotPackage.version) {
            throw "Source @github/copilot/package.json does not contain a version."
          }
          if (-not (Test-Path $ignorePath -PathType Leaf)) {
            throw "Dependency exclusion file was not found: $ignorePath"
          }

          # The upstream @github/copilot/** rule removes the SDK and its parent
          # package.json. The packaging shim needs BOTH: sdk/ for its files and
          # package.json to read the exact @github/copilot version when selecting
          # the matching native platform package.
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in (Get-Content $ignorePath)) { $lines.Add($line) }

          $excludeIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -match '^@github/copilot/\*\*/?$') {
              $excludeIndex = $i
              break
            }
          }
          if ($excludeIndex -lt 0) {
            throw "Expected upstream @github/copilot/** exclusion was not found in build/.moduleignore."
          }

          $includeRules = @(
            "!@github/copilot/package.json",
            "!@github/copilot/sdk/**"
          )
          $inserted = 0
          foreach ($rule in $includeRules) {
            # A negation must appear AFTER the broad exclusion to take effect.
            $presentAfterExclude = $false
            for ($j = $excludeIndex + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j].Trim() -eq $rule) {
                $presentAfterExclude = $true
                break
              }
            }
            if (-not $presentAfterExclude) {
              $lines.Insert($excludeIndex + 1 + $inserted, $rule)
              $inserted++
            }
          }

          [System.IO.File]::WriteAllLines($ignorePath, $lines, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Preserved Copilot packaging rules:"
          Write-Host "  !@github/copilot/package.json"
          Write-Host "  !@github/copilot/sdk/**"

      - name: Build Linux archive, Debian package, and RPM package
        if: matrix.platform == 'linux-x64'
        working-directory: vscode
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=production

          npm run gulp vscode-linux-x64-min
          npm run gulp vscode-linux-x64-build-deb
          npm run gulp vscode-linux-x64-build-rpm

          # The packaged application directory is one level above the source checkout.
          tar -czf ../code-oss-linux-x64.tar.gz -C .. VSCode-linux-x64

          DEB=$(find .build/linux/deb -type f -name '*.deb' -print -quit || true)
          RPM=$(find .build/linux/rpm -type f -name '*.rpm' -print -quit || true)
          test -n "$DEB" && test -s "$DEB" || {
            echo "No Debian package was generated under vscode/.build/linux/deb" >&2
            exit 1
          }
          test -n "$RPM" && test -s "$RPM" || {
            echo "No RPM package was generated under vscode/.build/linux/rpm" >&2
            exit 1
          }

          cp "$DEB" ../code-oss-linux-x64.deb
          cp "$RPM" ../code-oss-linux-x64.rpm
          ls -lh ../code-oss-linux-x64.tar.gz ../code-oss-linux-x64.deb ../code-oss-linux-x64.rpm

      - name: Build Windows portable archive and installer
        if: matrix.platform == 'windows-x64'
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:NODE_ENV = "production"

          npm run gulp vscode-win32-x64-min
          if ($LASTEXITCODE -ne 0) { throw "Windows application build failed." }

          npm run gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { throw "Windows Inno Setup updater preparation failed." }

          npm run gulp vscode-win32-x64-user-setup
          if ($LASTEXITCODE -ne 0) { throw "Windows user installer build failed." }

          $workspace = $env:GITHUB_WORKSPACE
          $packageDir = Join-Path $workspace "VSCode-win32-x64"
          if (-not (Test-Path $packageDir -PathType Container)) {
            throw "Windows application output was not found at $packageDir"
          }

          $zipPath = Join-Path $workspace "code-oss-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal

          $setupDir = Join-Path $PWD ".build\win32-x64\user-setup"
          if (-not (Test-Path $setupDir -PathType Container)) {
            throw "Windows installer output directory was not found at $setupDir"
          }
          $installers = @(Get-ChildItem $setupDir -Filter "*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No Windows installer executable was generated in $setupDir"
          }

          $installerPath = Join-Path $workspace "code-oss-windows-x64-setup.exe"
          Copy-Item $installers[0].FullName $installerPath -Force
          Get-Item $zipPath, $installerPath | Select-Object Name, Length

      - name: Upload Linux packages
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: code-oss-${{ matrix.platform }}-${{ needs.check.outputs.tag }}
          path: |
            code-oss-linux-x64.tar.gz
            code-oss-linux-x64.deb
            code-oss-linux-x64.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer and portable archive
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: code-oss-${{ matrix.platform }}-${{ needs.check.outputs.tag }}
          path: |
            code-oss-windows-x64.zip
            code-oss-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all build assets
        uses: actions/download-artifact@v7
        with:
          pattern: code-oss-*-${{ needs.check.outputs.tag }}
          path: release-assets
          merge-multiple: true

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No build assets were downloaded." >&2
            exit 1
          fi

          title="Code - OSS ${UPSTREAM_TAG} (Open VSX, privacy defaults)"
          notes=$(cat <<EOF
          Privacy-hardened Code - OSS build from upstream Microsoft VS Code tag ${UPSTREAM_TAG}.

          Included assets:
          - Windows x64 setup installer and portable ZIP
          - Debian/Ubuntu x64 .deb package
          - Fedora/RHEL-compatible x64 .rpm package
          - Generic Linux x64 .tar.gz archive

          Extensions are served by Open VSX. Telemetry is disabled in the product configuration; update and AI-related settings have privacy-focused defaults.
          EOF
          )

          if gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$UPSTREAM_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes"
          else
            gh release create "$UPSTREAM_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi

          gh release upload "$UPSTREAM_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  record:
    needs: [check, release]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Record successfully published upstream release
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "$UPSTREAM_TAG" > .upstream-vscode-release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream-vscode-release

          if ! git diff --cached --quiet; then
            git commit -m "chore: record upstream VS Code release $UPSTREAM_TAG"
            git push
          fi
