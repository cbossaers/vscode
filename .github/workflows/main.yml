
name: Build Privacy-Hardened Code - OSS

on:
  schedule:
    - cron: "23 5 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the release was already built
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: upstream-code-oss-release-build
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Find latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/vscode/releases?per_page=100" \
            | jq -er \
              '[.[] | select(.draft == false and .prerelease == false)]
               | .[0].tag_name // empty')

          if [ -z "$TAG" ]; then
            echo "No stable release found"
            exit 1
          fi

          echo "Latest stable release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          OLD=""
          if [ -f .upstream-vscode-release ]; then
            OLD=$(cat .upstream-vscode-release)
          fi

          if [ "$TAG" != "$OLD" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new release; skipping build."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    if: needs.check.outputs.changed == 'true'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            task: vscode-linux-x64-min
            output: VSCode-linux-x64
            archive: code-oss-linux-x64.tar.gz

          - os: windows-2022
            platform: windows-x64
            task: vscode-win32-x64-min
            output: VSCode-win32-x64
            archive: code-oss-windows-x64.zip

    steps:
      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ needs.check.outputs.tag }}
          path: vscode
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev \
            python-is-python3 \
            pkg-config

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows SDK and locate SignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          # Reuse an SDK already installed on the runner.
          $tool = $null

          if (Test-Path $kits) {
            $tool = Get-ChildItem `
              -Path $kits `
              -Filter signtool.exe `
              -Recurse `
              -File |
              Where-Object {
                $_.FullName -match '\\x64\\signtool\.exe$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          # Install the Windows SDK if SignTool is missing.
          if (-not $tool) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue

            if (-not $winget) {
              throw "SignTool is missing and winget is unavailable."
            }

            & winget.exe install `
              --id Microsoft.WindowsSDK.10.0.22621 `
              --exact `
              --silent `
              --accept-source-agreements `
              --accept-package-agreements

            if ($LASTEXITCODE -ne 0) {
              throw "Windows SDK installation failed: $LASTEXITCODE"
            }

            if (Test-Path $kits) {
              $tool = Get-ChildItem `
                -Path $kits `
                -Filter signtool.exe `
                -Recurse `
                -File |
                Where-Object {
                  $_.FullName -match '\\x64\\signtool\.exe$'
                } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
            }
          }

          if (-not $tool) {
            throw "SignTool was not found after SDK installation."
          }

          $tool.DirectoryName |
            Out-File -FilePath $env:GITHUB_PATH `
              -Append -Encoding utf8

          Write-Host "SignTool: $($tool.FullName)"

      - name: Install npm dependencies
        working-directory: vscode
        run: npm install
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Disable legacy product telemetry
        working-directory: vscode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = "product.json"

          if (-not (Test-Path $path)) {
            throw "Source product.json not found: $path"
          }

          $product = Get-Content $path -Raw |
            ConvertFrom-Json

          $product | Add-Member `
            -NotePropertyName enableTelemetry `
            -NotePropertyValue $false `
            -Force

          $product |
            ConvertTo-Json -Depth 100 |
            Set-Content -Path $path -Encoding utf8

          $check = Get-Content $path -Raw |
            ConvertFrom-Json

          if ($check.enableTelemetry -ne $false) {
            throw "Could not disable legacy product telemetry."
          }

          Write-Host "Legacy telemetry flag disabled."

      - name: Build application
        working-directory: vscode
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gulp ${{ matrix.task }}

      - name: Verify packaged product
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = "Stop"

          $root = "vscode/$env:OUTPUT_DIR"

          if (-not (Test-Path $root)) {
            throw "Package output not found: $root"
          }

          $product = Join-Path $root "resources/app/product.json"

          if (-not (Test-Path $product)) {
            throw "Packaged product.json not found: $product"
          }

          $config = Get-Content $product -Raw |
            ConvertFrom-Json

          if ($config.enableTelemetry -ne $false) {
            throw "Packaged product telemetry flag is not disabled."
          }

          Write-Host "Packaged product telemetry flag verified."

      - name: Create portable privacy settings
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = "Stop"

          $root = "vscode/$env:OUTPUT_DIR"

          if (-not (Test-Path $root)) {
            throw "Package output not found: $root"
          }

          $settingsDir = Join-Path $root "data/user-data/User"

          New-Item -ItemType Directory -Force `
            -Path $settingsDir | Out-Null

          $settings = @{
            "telemetry.telemetryLevel" = "off"
            "telemetry.feedback.enabled" = $false
            "workbench.enableExperiments" = $false
            "update.mode" = "none"
            "extensions.autoCheckUpdates" = $false
            "extensions.autoUpdate" = $false
          }

          $settingsPath = Join-Path $settingsDir "settings.json"

          $settings |
            ConvertTo-Json |
            Set-Content -Path $settingsPath -Encoding utf8

          if (-not (Test-Path $settingsPath)) {
            throw "Privacy settings were not created."
          }

          Write-Host "Portable privacy settings created."

      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.archive }}" \
            -C vscode "${{ matrix.output }}"

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "vscode/${{ matrix.output }}" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-oss-${{ matrix.platform }}-${{ needs.check.outputs.tag }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  record:
    name: Record successful release
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Record release tag
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail

          echo "$UPSTREAM_TAG" > .upstream-vscode-release

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream-vscode-release

          if ! git diff --cached --quiet; then
            git commit -m "chore: record upstream VS Code release"
            git push
          fi
