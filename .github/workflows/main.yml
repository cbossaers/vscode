name: Build VS Code (Windows + Linux)

# Place this file at .github/workflows/build-vscode.yml in YOUR repo.
# Builds the current commit of this repository (your VS Code fork), patches
# product.json (Open VSX marketplace + privacy-friendly defaults), builds,
# packages, and publishes a GitHub release tagged with the current UTC date.

on:
  schedule:
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Generate one date tag shared by both build jobs and the release job
  # ---------------------------------------------------------------------------
  metadata:
    name: Generate release date
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Generate UTC date tag
        id: date
        run: |
          set -euo pipefail
          TAG="$(date -u +'%Y-%m-%d')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

  # ---------------------------------------------------------------------------
  # 2. Build + package on Linux and Windows
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            rust_target: x86_64-unknown-linux-gnu
          - name: win32-x64
            os: windows-2022
            platform: win32
            rust_target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
      VSCODE_ARCH: x64
      OUT_DIR: VSCode-${{ matrix.platform }}-x64
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout this fork
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: vscode
          fetch-depth: 1

      - name: Setup Node.js (version from this fork's .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode/.nvmrc
          # Cache npm's package downloads (not node_modules, which npm ci removes).
          # Both lockfiles are included because the build workspace has its own npm ci.
          cache: npm
          cache-dependency-path: |
            vscode/package-lock.json
            vscode/build/package-lock.json

      - name: Setup Python (needed by node-gyp)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python setuptools
        run: python -m pip install --upgrade pip setuptools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ---- Linux prerequisites (from the VS Code build requirements) ----
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ pkg-config python-is-python3 jq \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm dpkg-dev xz-utils libssl-dev curl

      # ---- Windows prerequisites --------------------------------------------
      - name: Install MSVC Spectre-mitigated libraries (Windows, only if missing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          $requiredComponents = @(
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "Microsoft.VisualStudio.Component.VC.ATL.Spectre",
            "Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre"
          )

          # GitHub-hosted images are recreated for each job. Avoid running the
          # Visual Studio installer when the image already contains every component.
          $queryArgs = @("-latest", "-products", "*") + @("-requires") + $requiredComponents + @("-property", "installationPath")
          $installPath = & $vswhere @queryArgs
          if ($installPath) {
            Write-Host "All required MSVC Spectre components are already installed at: $installPath"
            exit 0
          }

          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) {
            throw "Could not find a Visual Studio installation to add the required Spectre components."
          }

          $vsArgs = @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL.Spectre",
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre",
            "--quiet", "--norestart", "--nocache"
          )
          $p = Start-Process -FilePath "$installerDir\setup.exe" -ArgumentList $vsArgs -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Visual Studio installer failed with exit code $($p.ExitCode)"
          }

      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The job uses Bash on Windows. GitHub prepends Git's usr/bin to PATH for
      # every Bash step, where its GNU link.exe can shadow Microsoft's linker.
      # Pin Cargo to the actual MSVC linker instead of relying on PATH lookup.
      - name: Pin Rust to the Microsoft linker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcToolsDir = $env:VCToolsInstallDir
          $linker = if ($vcToolsDir) { Join-Path $vcToolsDir 'bin\Hostx64\x64\link.exe' } else { $null }

          if (-not $linker -or -not (Test-Path $linker)) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) {
              throw "Could not find vswhere.exe or VCToolsInstallDir; cannot locate the MSVC linker."
            }
            $installPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installPath) {
              throw "Could not find a Visual Studio installation with the x64 C++ tools."
            }
            $toolsRoot = Join-Path $installPath 'VC\Tools\MSVC'
            $toolsDir = Get-ChildItem $toolsRoot -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            if (-not $toolsDir) {
              throw "No MSVC toolset directory found under $toolsRoot."
            }
            $linker = Join-Path $toolsDir.FullName 'bin\Hostx64\x64\link.exe'
          }

          if (-not (Test-Path $linker)) {
            throw "MSVC linker not found at '$linker'."
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Pinned Rust MSVC linker: $linker"

      # ---- Customise product.json -------------------------------------------
      # Open VSX gallery and user-overridable privacy/update defaults.
      - name: Patch product.json (Open VSX + default settings)
        working-directory: vscode
        run: |
          cp product.json product.json.orig
          jq '
            .extensionsGallery = {
              serviceUrl: "https://open-vsx.org/vscode/gallery",
              itemUrl: "https://open-vsx.org/vscode/item",
              extensionUrlTemplate: "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest",
              resourceUrlTemplate: "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
              controlUrl: "",
              nlsBaseUrl: "",
              publisherUrl: ""
            }
            | .configurationDefaults = ((.configurationDefaults // {}) + {
                "extensions.autoCheckUpdates": false,
                "extensions.autoUpdate": false,
                "update.mode": "none",
                "update.showReleaseNotes": false,
                "telemetry.telemetryLevel": "off",
                "chat.disableAIFeatures": true
              })
          ' product.json.orig > product.json
          rm product.json.orig
          echo "--- patched product.json (relevant keys) ---"
          jq '{extensionsGallery, configurationDefaults}' product.json

      # product.json is metadata; VS Code does not automatically apply
      # an arbitrary top-level `configurationDefaults` object from it. Wire that
      # object into the configuration registry so it becomes the actual default
      # values at runtime (while users can still override them in settings.json).
      - name: Wire product.json defaults into VS Code configuration
        working-directory: vscode
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path("src/vs/workbench/api/common/configurationExtensionPoint.ts")
          source = path.read_text(encoding="utf-8")
          marker = "// BEGIN custom product.json configuration defaults\n"
          if marker in source:
              raise SystemExit("Custom product defaults patch is already present; refusing to patch twice")

          needle = "defaultConfigurationExtPoint.setHandler((extensions, { added, removed }) => {"
          if source.count(needle) != 1:
              raise SystemExit(
                  f"Expected exactly one configuration extension-point anchor in {path}; "
                  f"found {source.count(needle)}. The source may have changed."
              )

          patch = "\n".join([
              "// BEGIN custom product.json configuration defaults",
              "// The product metadata is intentionally used as defaults, not as enforced policy.",
              "const productConfigurationDefaults = (product as typeof product & { configurationDefaults?: Record<string, unknown> }).configurationDefaults;",
              "if (productConfigurationDefaults && typeof productConfigurationDefaults === 'object') {",
              "\tconfigurationRegistry.deltaConfiguration({",
              "\t\taddedDefaults: [{",
              "\t\t\toverrides: productConfigurationDefaults,",
              "\t\t\tsource: { id: 'product', displayName: 'Product defaults' }",
              "\t\t}]",
              "\t});",
              "}",
              "// END custom product.json configuration defaults",
              "",
              ""
          ])
          source = source.replace(needle, patch + needle, 1)
          path.write_text(source, encoding="utf-8")
          print(f"Patched {path} to apply product.json configurationDefaults")
          PYCODE

      # The from-source Copilot extension build is not identical to the prebuilt
      # VSIX used by Microsoft's CI. The packaging task
      # prepareBuiltInCopilotRipgrepShim still requires this runtime at
      # extensions/copilot/node_modules/@github/copilot/sdk. Re-include the
      # package metadata and SDK subtree after the broad ignore rule.
      - name: Preserve Copilot SDK files for packaging
        working-directory: vscode
        run: |
          set -euo pipefail
          printf '\n!@github/copilot/package.json\n!@github/copilot/sdk/**\n' >> build/.moduleignore
          tail -n 12 build/.moduleignore

      # ---- Install dependencies ---------------------------------------------
      # setup-env.sh runs build/*.ts helpers, which import packages from build/node_modules.
      # The build workspace dependencies must be installed before sourcing setup-env.sh.
      - name: Install build-script dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2; do
            if npm ci; then
              ok=1
              break
            fi
            echo "::warning::build npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      # Use the same compiler/sysroot/libc++ setup as Microsoft's Linux pipeline.
      # Do not force GCC 13: setup-env.sh configures Chromium's matching Clang and sysroot.
      - name: npm ci (Linux, VS Code toolchain)
        if: runner.os == 'Linux'
        working-directory: vscode
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source ./build/azure-pipelines/linux/setup-env.sh
          node build/npm/preinstall.ts

          ok=0
          for attempt in 1 2; do
            if npm ci; then
              ok=1
              break
            fi
            echo "::warning::npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      - name: npm ci (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node build/npm/preinstall.ts
          ok=0
          for attempt in 1 2; do
            if npm ci; then
              ok=1
              break
            fi
            echo "::warning::npm ci failed (attempt ${attempt}/2), cleaning up and retrying..."
            rm -rf node_modules
            sleep 20
          done
          [[ "$ok" == "1" ]]

      # ---- Compile + package the app (portable directory) --------------------
      - name: Build VS Code
        working-directory: vscode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run gulp -- core-ci
          npm run gulp -- compile-extensions-build
          # Must run after compile-extensions-build (which wipes .build/extensions).
          npm run gulp -- compile-copilot-extension-build

          # Validate the source-built extension and the SDK directory required
          # by prepareBuiltInCopilotRipgrepShim during product packaging.
          for f in package.json dist/extension.js; do
            test -f ".build/extensions/copilot/$f" || {
              echo "::error::.build/extensions/copilot/$f missing after compile-copilot-extension-build"
              find .build/extensions/copilot -maxdepth 4 -type f | head -200 || true
              exit 1
            }
          done
          sdk_dir=".build/extensions/copilot/node_modules/@github/copilot/sdk"
          if [[ ! -d "$sdk_dir" ]]; then
            echo "::error::$sdk_dir missing after compile-copilot-extension-build; check build/.moduleignore preservation rules"
            find .build/extensions/copilot/node_modules/@github -maxdepth 5 -print 2>/dev/null | head -200 || true
            exit 1
          fi

          npm run gulp -- "vscode-${{ matrix.platform }}-${VSCODE_ARCH}-min-ci"

      - name: Verify the built product.json contains our customisations
        run: |
          set -euo pipefail
          jq -e '
            .extensionsGallery.serviceUrl == "https://open-vsx.org/vscode/gallery"
            and .configurationDefaults["extensions.autoCheckUpdates"] == false
            and .configurationDefaults["extensions.autoUpdate"] == false
            and .configurationDefaults["update.mode"] == "none"
            and .configurationDefaults["update.showReleaseNotes"] == false
            and .configurationDefaults["telemetry.telemetryLevel"] == "off"
            and .configurationDefaults["chat.disableAIFeatures"] == true
          ' "${OUT_DIR}/resources/app/product.json"

      # ---- Cache Rust dependencies used by the CLI --------------------------
      # Keep this cache separate per OS/target. The Cargo registry and Git sources
      # are reusable, while compiled target output is intentionally not cached.
      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.rust_target }}-${{ hashFiles('vscode/cli/**/Cargo.lock', 'vscode/cli/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust_target }}-

      # ---- CLI / Remote Tunnels binary --------------------------------------
      # Use the glibc 2.28 sysroot and use prebuilt static OpenSSL.
      # This prevents the CLI from pulling in host-only dependencies such as
      # libssl3t64 and GLIBC symbols newer than the supported baseline.
      - name: Build CLI / tunnel binary (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode/cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          SYSROOT_ARCH: amd64
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail

          npm pack @vscode/openssl-prebuilt@0.0.11
          mkdir -p openssl
          tar -xzf vscode-openssl-prebuilt-0.0.11.tgz --strip-components=1 -C openssl
          export OPENSSL_LIB_DIR="$PWD/openssl/out/x64-linux/lib"
          export OPENSSL_INCLUDE_DIR="$PWD/openssl/out/x64-linux/include"

          export VSCODE_SYSROOT_DIR="$GITHUB_WORKSPACE/vscode/.build/sysroots"
          node -e 'import { getVSCodeSysroot } from "../build/linux/debian/install-sysroot.ts"; (async () => { await getVSCodeSysroot(process.env["SYSROOT_ARCH"]); })()'

          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/bin/x86_64-linux-gnu-gcc"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=--sysroot=$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot -C link-arg=-L$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot/usr/lib/x86_64-linux-gnu"
          export CC_x86_64_unknown_linux_gnu="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/bin/x86_64-linux-gnu-gcc --sysroot=$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot"
          export PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot/usr/lib/x86_64-linux-gnu/pkgconfig:$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR_x86_64_unknown_linux_gnu="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/sysroot"
          export OBJDUMP="$VSCODE_SYSROOT_DIR/x86_64-linux-gnu/x86_64-linux-gnu/bin/objdump"

          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-gnu --bin=code

          # Enforce the same glibc 2.28 compatibility check used by the VS Code build.
          glibc_version="2.28"
          while IFS= read -r line; do
            if [[ "$line" == *"GLIBC_"* ]]; then
              version="$(echo "$line" | awk '{print $5}' | tr -d '()')"
              version="${version#*_}"
              if [[ "$(printf '%s\n%s' "$version" "$glibc_version" | sort -V | tail -n1)" == "$version" ]]; then
                glibc_version="$version"
              fi
            fi
          done < <("$OBJDUMP" -T "$PWD/target/x86_64-unknown-linux-gnu/release/code")
          if [[ "$glibc_version" != "2.28" ]]; then
            echo "::error::CLI requires GLIBC $glibc_version; expected no newer than 2.28"
            exit 1
          fi
          echo "Maximum CLI GLIBC version: $glibc_version"

          TUNNEL_NAME="$(jq -r .tunnelApplicationName ../product.json)"
          mkdir -p "$GITHUB_WORKSPACE/${OUT_DIR}/bin"
          install -m 755 "target/x86_64-unknown-linux-gnu/release/code" \
            "$GITHUB_WORKSPACE/${OUT_DIR}/bin/${TUNNEL_NAME}"
          ls -l "$GITHUB_WORKSPACE/${OUT_DIR}/bin"

      - name: Build CLI / tunnel binary (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode/cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail

          npm pack @vscode/openssl-prebuilt@0.0.11
          mkdir -p openssl
          tar -xzf vscode-openssl-prebuilt-0.0.11.tgz --strip-components=1 -C openssl
          export OPENSSL_LIB_DIR="$PWD/openssl/out/x64-windows-static/lib"
          export OPENSSL_INCLUDE_DIR="$PWD/openssl/out/x64-windows-static/include"

          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc --bin=code

          TUNNEL_NAME="$(jq -r .tunnelApplicationName ../product.json)"
          mkdir -p "$GITHUB_WORKSPACE/${OUT_DIR}/bin"
          cp "target/x86_64-pc-windows-msvc/release/code.exe" \
            "$GITHUB_WORKSPACE/${OUT_DIR}/bin/${TUNNEL_NAME}.exe"
          ls -l "$GITHUB_WORKSPACE/${OUT_DIR}/bin"

      # ---- Linux packaging: tar.gz (portable), .deb, .rpm -------------------
      - name: Package (Linux) - tar.gz, deb, rpm
        if: runner.os == 'Linux'
        working-directory: vscode
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # Portable archive.
          tar --owner=0 --group=0 -czf "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.tar.gz" \
            -C "$GITHUB_WORKSPACE" "$OUT_DIR"

          # Debian / Ubuntu installer.
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-prepare-deb"
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-build-deb"

          # Fedora / RHEL / openSUSE installer.
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-prepare-rpm"
          npm run gulp -- "vscode-linux-${VSCODE_ARCH}-build-rpm"

          pick() {
            local f
            f="$(find "$1" -type f -name "$2" -print -quit)"
            [[ -n "$f" ]] || { echo "::error::No $2 found under $1"; exit 1; }
            echo "$f"
          }
          cp "$(pick .build/linux/deb '*.deb')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.deb"
          cp "$(pick .build/linux/rpm '*.rpm')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-linux-x64.rpm"
          ls -lh "$GITHUB_WORKSPACE/dist"

      # ---- Windows packaging: zip (portable), system + user installers ------
      - name: Package (Windows) - zip, system setup, user setup
        if: runner.os == 'Windows'
        working-directory: vscode
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"

          npm run gulp -- "vscode-win32-${VSCODE_ARCH}-inno-updater"
          npm run gulp -- "vscode-win32-${VSCODE_ARCH}-system-setup"
          npm run gulp -- "vscode-win32-${VSCODE_ARCH}-user-setup"

          pick() {
            local f
            f="$(find "$1" -type f -name "$2" -print -quit)"
            [[ -n "$f" ]] || { echo "::error::No $2 found under $1"; exit 1; }
            echo "$f"
          }
          cp "$(pick .build/win32-x64/system-setup '*.exe')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64-system-setup.exe"
          cp "$(pick .build/win32-x64/user-setup '*.exe')" "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64-user-setup.exe"

          # Portable zip (create a "data" folder next to "Code - OSS.exe" for portable mode).
          cd "$GITHUB_WORKSPACE/$OUT_DIR"
          7z a -tzip -mx=5 -bd "$GITHUB_WORKSPACE/dist/code-oss-${TAG}-win32-x64.zip" ./*
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Create the release (only when every build job succeeded)
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code - OSS ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Build of `${{ github.repository }}` at commit `${{ github.sha }}` (ref `${{ github.ref_name }}`).

            **Build-time changes**
            - Extension marketplace: [Open VSX](https://open-vsx.org)
            - Defaults: `extensions.autoCheckUpdates=false`, `extensions.autoUpdate=false`, `update.mode=none`,
              `update.showReleaseNotes=false`, `telemetry.telemetryLevel=off`, `chat.disableAIFeatures=true`
              (users can still change these in their own settings)

            **Downloads**
            | Platform | Installer | Portable |
            |---|---|---|
